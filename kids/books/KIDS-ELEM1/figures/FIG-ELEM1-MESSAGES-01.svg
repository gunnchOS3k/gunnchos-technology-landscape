<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="FIG-ELEM1-MESSAGES-01-title FIG-ELEM1-MESSAGES-01-desc" data-asset-id="FIG-ELEM1-MESSAGES-01">
  <title id="FIG-ELEM1-MESSAGES-01-title">FIG-ELEM1-MESSAGES-01: Message packets on a path</title>
  <desc id="FIG-ELEM1-MESSAGES-01-desc">A message card splits into three numbered packet envelopes traveling a path from Device A to Device B.</desc>
  <rect width="900" height="560" fill="#fffef8"/>
  <rect x="18" y="18" width="864" height="524" fill="none" stroke="#222" stroke-width="3"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="18" fill="#111">FIG-ELEM1-MESSAGES-01</text>
  <text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">truth_class: CONCEPTUAL_EDUCATIONAL_PROTOTYPE · age_band: KIDS-ELEM1 · cast: Signal Crew (provisional)</text>
  <text x="40" y="104" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#111">Message packets on a path</text>
  <rect x="60" y="200" width="140" height="90" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="130" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#111">Device A</text>
  <rect x="700" y="200" width="140" height="90" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="770" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#111">Device B</text>
  <line x1="210" y1="245" x2="690" y2="245" stroke="#111" stroke-width="3"/>
  <polygon points="690,245 670,235 670,255" fill="#111"/>
  <rect x="280" y="150" width="70" height="50" rx="4" fill="#f0f4f8" stroke="#111" stroke-width="2"/>
  <text x="315" y="182" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111">1</text>
  <rect x="410" y="150" width="70" height="50" rx="4" fill="#f0f4f8" stroke="#111" stroke-width="2"/>
  <text x="445" y="182" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111">2</text>
  <rect x="540" y="150" width="70" height="50" rx="4" fill="#f0f4f8" stroke="#111" stroke-width="2"/>
  <text x="575" y="182" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111">3</text>
  <text x="450" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111">Packets = message pieces with addresses</text>
  <text x="450" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Ping: here → there · pieces may take turns on the path</text>
  <text x="40" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">Wi-Fi is one kind of road; the internet is the bigger web of roads.</text>
  <text x="40" y="536" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">KIDS FULL WORKING MANUSCRIPT · NOT CHILD-VALIDATED · NOT PUBLICATION-READY</text>
</svg>
