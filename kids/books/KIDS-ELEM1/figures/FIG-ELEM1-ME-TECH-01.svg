<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="FIG-ELEM1-ME-TECH-01-title FIG-ELEM1-ME-TECH-01-desc" data-asset-id="FIG-ELEM1-ME-TECH-01">
  <title id="FIG-ELEM1-ME-TECH-01-title">FIG-ELEM1-ME-TECH-01: People, parts, and rules</title>
  <desc id="FIG-ELEM1-ME-TECH-01-desc">Three labeled boxes — People, Parts, Rules — around a tablet screen that is only one part of a larger system.</desc>
  <rect width="900" height="560" fill="#fffef8"/>
  <rect x="18" y="18" width="864" height="524" fill="none" stroke="#222" stroke-width="3"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="18" fill="#111">FIG-ELEM1-ME-TECH-01</text>
  <text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">truth_class: CONCEPTUAL_EDUCATIONAL_PROTOTYPE · age_band: KIDS-ELEM1 · cast: Signal Crew (provisional)</text>
  <text x="40" y="104" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#111">People, parts, and rules</text>
  <rect x="60" y="140" width="220" height="120" rx="8" fill="#f0f4f8" stroke="#111" stroke-width="3"/>
  <text x="170" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#111">People</text>
  <text x="170" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">who use &amp; decide</text>
  <rect x="340" y="140" width="220" height="120" rx="8" fill="#f7f2e8" stroke="#111" stroke-width="3"/>
  <text x="450" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#111">Parts</text>
  <text x="450" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">hardware you can touch</text>
  <rect x="620" y="140" width="220" height="120" rx="8" fill="#eef6ef" stroke="#111" stroke-width="3"/>
  <text x="730" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#111">Rules</text>
  <text x="730" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">software &amp; permissions</text>
  <rect x="300" y="300" width="300" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="450" y="340" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111">Screen = one window</text>
  <text x="450" y="368" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">not the whole system</text>
  <line x1="170" y1="260" x2="360" y2="300" stroke="#111" stroke-width="2"/>
  <line x1="450" y1="260" x2="450" y2="300" stroke="#111" stroke-width="2"/>
  <line x1="730" y1="260" x2="540" y2="300" stroke="#111" stroke-width="2"/>
  <text x="40" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">Shape + label encode meaning (color is optional accent only).</text>
  <text x="40" y="536" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">KIDS FULL WORKING MANUSCRIPT · NOT CHILD-VALIDATED · NOT PUBLICATION-READY</text>
</svg>
