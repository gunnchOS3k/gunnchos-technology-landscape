<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="FIG-ELEM1-ME-TECH-03-title FIG-ELEM1-ME-TECH-03-desc" data-asset-id="FIG-ELEM1-ME-TECH-03">
  <title id="FIG-ELEM1-ME-TECH-03-title">FIG-ELEM1-ME-TECH-03: Local tap vs network tap</title>
  <desc id="FIG-ELEM1-ME-TECH-03-desc">Two paths from one tablet: a short local loop labeled Local, and a longer path labeled Network message.</desc>
  <rect width="900" height="560" fill="#fffef8"/>
  <rect x="18" y="18" width="864" height="524" fill="none" stroke="#222" stroke-width="3"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="18" fill="#111">FIG-ELEM1-ME-TECH-03</text>
  <text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">truth_class: CONCEPTUAL_EDUCATIONAL_PROTOTYPE · age_band: KIDS-ELEM1 · cast: Signal Crew (provisional)</text>
  <text x="40" y="104" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#111">Local tap vs network tap</text>
  <rect x="80" y="160" width="160" height="120" rx="10" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="160" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#111">Tablet</text>
  <path d="M250 200 C320 140, 380 140, 450 200 C380 260, 320 260, 250 200" fill="none" stroke="#111" stroke-width="3"/>
  <text x="360" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111">Local loop</text>
  <line x1="240" y1="250" x2="520" y2="320" stroke="#111" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="530" y="280" width="220" height="90" rx="8" fill="#f0f4f8" stroke="#111" stroke-width="3"/>
  <text x="640" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#111">Network path</text>
  <text x="640" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">message may wait</text>
  <text x="40" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">Solid = local · dashed = may leave the room (pattern + label, not color alone).</text>
  <text x="40" y="536" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">KIDS FULL WORKING MANUSCRIPT · NOT CHILD-VALIDATED · NOT PUBLICATION-READY</text>
