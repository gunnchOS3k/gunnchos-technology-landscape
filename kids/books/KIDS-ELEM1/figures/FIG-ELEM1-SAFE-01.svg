<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="FIG-ELEM1-SAFE-01-title FIG-ELEM1-SAFE-01-desc" data-asset-id="FIG-ELEM1-SAFE-01">
  <title id="FIG-ELEM1-SAFE-01-title">FIG-ELEM1-SAFE-01: Locks, permissions, fair access</title>
  <desc id="FIG-ELEM1-SAFE-01-desc">Three panels: lock/password, ask-before-share permission, and fair access tools for different needs.</desc>
  <rect width="900" height="560" fill="#fffef8"/>
  <rect x="18" y="18" width="864" height="524" fill="none" stroke="#222" stroke-width="3"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="18" fill="#111">FIG-ELEM1-SAFE-01</text>
  <text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">truth_class: CONCEPTUAL_EDUCATIONAL_PROTOTYPE · age_band: KIDS-ELEM1 · cast: Signal Crew (provisional)</text>
  <text x="40" y="104" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#111">Locks, permissions, fair access</text>
  <rect x="60" y="150" width="240" height="200" rx="10" fill="#f0f4f8" stroke="#111" stroke-width="3"/>
  <text x="180" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#111">Locks</text>
  <text x="180" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">passwords &amp; device</text>
  <text x="180" y="265" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">locks protect access</text>
  <rect x="330" y="150" width="240" height="200" rx="10" fill="#eef6ef" stroke="#111" stroke-width="3"/>
  <text x="450" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#111">Permissions</text>
  <text x="450" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">ask before sharing</text>
  <text x="450" y="265" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">name · photo · school</text>
  <rect x="600" y="150" width="240" height="200" rx="10" fill="#f7f2e8" stroke="#111" stroke-width="3"/>
  <text x="720" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#111">Fair access</text>
  <text x="720" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">different tools OK</text>
  <text x="720" y="265" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">include everyone</text>
  <text x="40" y="420" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">Shield: pause and check. Privacy is not hiding forever — it is choosing who can see.</text>
  <text x="40" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">Accessibility is part of fairness, not an optional extra.</text>
  <text x="40" y="536" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">KIDS FULL WORKING MANUSCRIPT · NOT CHILD-VALIDATED · NOT PUBLICATION-READY</text>
</svg>
