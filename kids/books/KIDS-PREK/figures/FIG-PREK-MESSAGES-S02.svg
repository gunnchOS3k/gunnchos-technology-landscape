<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="FIG-PREK-MESSAGES-S02-title FIG-PREK-MESSAGES-S02-desc" data-asset-id="FIG-PREK-MESSAGES-S02">
  <title id="FIG-PREK-MESSAGES-S02-title">FIG-PREK-MESSAGES-S02: Local or far?</title>
  <desc id="FIG-PREK-MESSAGES-S02-desc">Local copy vs far ask paths.</desc>
  <rect width="800" height="500" fill="#fffef8"/>
  <rect x="16" y="16" width="768" height="468" fill="none" stroke="#222" stroke-width="3"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="18" fill="#111">FIG-PREK-MESSAGES-S02</text>
  <text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">truth_class: CONCEPTUAL_EDUCATIONAL_PROTOTYPE · age_band: PREK</text>
  <text x="40" y="98" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#111">Local or far?</text>
  <text x="40" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Cast (provisional): Mira · Bolt · Step · Ping · Shield</text>
  
  <circle cx="220" cy="240" r="60" fill="#f4f4f4" stroke="#111" stroke-width="3"/><text x="220" y="245" text-anchor="middle">local</text>
  <circle cx="580" cy="240" r="60" fill="#f4f4f4" stroke="#111" stroke-width="3"/><text x="580" y="245" text-anchor="middle">far ask</text>
  <path d="M280 240 C360 180, 440 180, 520 240" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="6 6"/>

  <foreignObject x="40" y="360" width="720" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 15px; color:#111; line-height:1.35;">Notice: sometimes the answer is already here. Sometimes a message must ask far away.</div>
  </foreignObject>

  <text x="40" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">KIDS DEVELOPMENTAL PROTOTYPE · NOT CHILD-VALIDATED · NOT PUBLICATION-READY</text>
</svg>
