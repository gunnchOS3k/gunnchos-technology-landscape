<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="FIG-PREK-INSIDE-S08-title FIG-PREK-INSIDE-S08-desc" data-asset-id="FIG-PREK-INSIDE-S08">
  <title id="FIG-PREK-INSIDE-S08-title">FIG-PREK-INSIDE-S08: Make sorting mats</title>
  <desc id="FIG-PREK-INSIDE-S08-desc">Two mats with sample cards sorted.</desc>
  <rect width="800" height="500" fill="#fffef8"/>
  <rect x="16" y="16" width="768" height="468" fill="none" stroke="#222" stroke-width="3"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="18" fill="#111">FIG-PREK-INSIDE-S08</text>
  <text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">truth_class: CONCEPTUAL_EDUCATIONAL_PROTOTYPE · age_band: PREK</text>
  <text x="40" y="98" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#111">Make sorting mats</text>
  <text x="40" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Cast (provisional): Mira · Bolt · Step · Ping · Shield</text>
  
  <rect x="120" y="180" width="220" height="160" rx="10" fill="#f4f4f4" stroke="#111" stroke-width="3"/>
  <text x="230" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="20">Working Space</text>
  <text x="230" y="270" text-anchor="middle" font-size="14">now</text>
  <rect x="460" y="180" width="220" height="160" rx="10" fill="#f4f4f4" stroke="#111" stroke-width="3"/>
  <text x="570" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="20">Keep-Box</text>
  <text x="570" y="270" text-anchor="middle" font-size="14">later</text>

  <foreignObject x="40" y="360" width="720" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 15px; color:#111; line-height:1.35;">Make two mats: Working Space and Keep-Box. Sort picture cards into each mat.</div>
  </foreignObject>

  <text x="40" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">KIDS DEVELOPMENTAL PROTOTYPE · NOT CHILD-VALIDATED · NOT PUBLICATION-READY</text>
