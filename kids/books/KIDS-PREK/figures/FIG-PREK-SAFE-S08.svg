<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="FIG-PREK-SAFE-S08-title FIG-PREK-SAFE-S08-desc" data-asset-id="FIG-PREK-SAFE-S08">
  <title id="FIG-PREK-SAFE-S08-title">FIG-PREK-SAFE-S08: Make a pause sign</title>
  <desc id="FIG-PREK-SAFE-S08-desc">Simple Pause-and-Ask sign.</desc>
  <rect width="800" height="500" fill="#fffef8"/>
  <rect x="16" y="16" width="768" height="468" fill="none" stroke="#222" stroke-width="3"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="18" fill="#111">FIG-PREK-SAFE-S08</text>
  <text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">truth_class: CONCEPTUAL_EDUCATIONAL_PROTOTYPE · age_band: PREK</text>
  <text x="40" y="98" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#111">Make a pause sign</text>
  <text x="40" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Cast (provisional): Mira · Bolt · Step · Ping · Shield</text>
  
  <rect x="280" y="160" width="240" height="180" rx="12" fill="#f4f4f4" stroke="#111" stroke-width="4"/>
