  <text x="400" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="22">and ASK</text>

  <foreignObject x="40" y="360" width="720" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 15px; color:#111; line-height:1.35;">Make a Pause-and-Ask sign for the family device corner. Practice holding it up.</div>
  </foreignObject>

  <text x="40" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">KIDS DEVELOPMENTAL PROTOTYPE · NOT CHILD-VALIDATED · NOT PUBLICATION-READY</text>
