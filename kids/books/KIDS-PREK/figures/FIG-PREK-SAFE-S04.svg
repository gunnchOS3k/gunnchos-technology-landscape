<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="FIG-PREK-SAFE-S04-title FIG-PREK-SAFE-S04-desc" data-asset-id="FIG-PREK-SAFE-S04">
