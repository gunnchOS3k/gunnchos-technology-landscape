  <text x="400" y="400" text-anchor="middle" font-size="14">fair = include helpers</text>

  <foreignObject x="40" y="360" width="720" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 15px; color:#111; line-height:1.35;">Connect: fair means friends who need different tools can still join. Accessibility is part of fairness.</div>
