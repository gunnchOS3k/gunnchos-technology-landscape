<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="FIG-PREK-BUILD-S03-title FIG-PREK-BUILD-S03-desc" data-asset-id="FIG-PREK-BUILD-S03">
  <title id="FIG-PREK-BUILD-S03-title">FIG-PREK-BUILD-S03: Test means check</title>
  <desc id="FIG-PREK-BUILD-S03-desc">Test checkbox beside a sequence.</desc>
  <rect width="800" height="500" fill="#fffef8"/>
  <rect x="16" y="16" width="768" height="468" fill="none" stroke="#222" stroke-width="3"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="18" fill="#111">FIG-PREK-BUILD-S03</text>
  <text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">truth_class: CONCEPTUAL_EDUCATIONAL_PROTOTYPE · age_band: PREK</text>
  <text x="40" y="98" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#111">Test means check</text>
  <text x="40" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">Cast (provisional): Mira · Bolt · Step · Ping · Shield</text>
  
  <rect x="200" y="200" width="240" height="80" rx="8" fill="#f4f4f4" stroke="#111" stroke-width="3"/>
  <text x="320" y="248" text-anchor="middle" font-size="20">sequence</text>
  <rect x="480" y="210" width="60" height="60" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="510" y="248" text-anchor="middle" font-size="28">✓</text>
  <text x="510" y="300" text-anchor="middle" font-size="14">test</text>

  <foreignObject x="40" y="360" width="720" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 15px; color:#111; line-height:1.35;">Name it: a test means we check if the sequence works. If not, we fix and try again.</div>
  </foreignObject>

  <text x="40" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">KIDS DEVELOPMENTAL PROTOTYPE · NOT CHILD-VALIDATED · NOT PUBLICATION-READY</text>
</svg>
