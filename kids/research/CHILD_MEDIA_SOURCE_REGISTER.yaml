# Child-media source register for Kids Edition foundation.
# Official / peer-reviewed / professional developmental bodies preferred.
# Do not paste copyrighted full texts. Concise citation + allowed-use only.
# retrieved_on: 2026-09-03 (wave foundation); re-verify before publication submission.

register_meta:
  register_id: CHILD_MEDIA_SOURCE_REGISTER
  version: "0.1.1"
  status: DRAFT_INTERNAL
  audited_on: "2026-09-03"
  audit_note: >
    QA pass removed unused vanity sources; fixed non-resolving DOIs/URLs;
    no source-count inflation. DOI redirects count as resolvable even when
    publisher bot-walls return 403.
  policy: >
    Primary evidence = peer-reviewed research and professional developmental /
    pediatric bodies. Methodology of children's media may be studied; copyrighted
    characters, scripts, songs, and plots must not be imitated.
  no_child_testing_in_this_wave: true

sources:
  - source_id: SRC-AAP-MEDIA-YOUNG-MINDS
    authority: American Academy of Pediatrics (AAP) Council on Communications and Media
    title: "Media and Young Minds"
    year: 2016
    citation: "AAP Council on Communications and Media. Media and Young Minds. Pediatrics. 2016;138(5):e20162591. doi:10.1542/peds.2016-2591."
    url: "https://pubmed.ncbi.nlm.nih.gov/27940791/"
    retrieved_on: "2026-09-03"
    source_type: professional_clinical_policy
    age_relevance: "0–5+; caregiver co-use; limits for infants/toddlers"
    topics: [caregiver_co_use, pacing, attention_vs_learning, child_centered_digital_design, privacy_and_agency]
    allowed_use: paraphrase_and_cite
    notes: "Print/interaction preferred for very young children; avoid unsupported screen-as-teacher claims. QA uses PubMed landing (publisher page bot-walls); DOI 10.1542/peds.2016-2591 resolves."

