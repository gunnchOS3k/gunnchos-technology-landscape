  iso3166_2: null
  name: United States of America
  level: national
  parent_jurisdiction_id: null
  region: americas
  education_authority: U.S. Department of Health & Human Services / ACF (Head Start); U.S. Department of Education (federal role); state education agencies for K–12
  research_status: OFFICIAL_SOURCE_VERIFIED
  framework_ids:
  - FW-US-HS-ELOF
  - FW-US-CCSS-2010
  - FW-CSTA-PK12-2026
  - FW-US-NGSS
  portals:
  - https://www.headstart.gov/school-readiness/article/head-start-early-learning-outcomes-framework
  - https://corestandards.org/
  - https://csteachers.org/pk12standards/
  - https://www.nextgenscience.org/
  - https://www.ed.gov/
  languages:
  - en
  subnational_structure: 50 states + District of Columbia education agencies (no single national K–12 curriculum)
  notes: 'Federal Head Start ELOF verified. Common Core (ELA/Math) hosted at corestandards.org (2010 initiative; state adoption varies). CSTA 2026 and NGSS are voluntary multi-state frameworks — not a national mandate. K–12 literacy/math/science/CS expectations are primarily SUBNATIONAL.'
  license_notes: 'Federal works (ELOF) vs copyrighted multi-state frameworks (CCSS/NGSS/CSTA) — summarize domains only; no wholesale paste.'
  last_reviewed_on: '2026-09-03'
