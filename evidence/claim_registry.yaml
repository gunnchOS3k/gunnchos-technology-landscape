claims:
  - claim_id: CLM-0001
    chapter: CH02
    text: "WAIKE accepted main hosts file-backed curriculum packages and lab validators, including COMPUTER_NETWORKING, GAME_DEV_INTERACTIVE, EMBEDDED_PROTOTYPING, and SOFTWARE_BUILDER digital_rc courses."
    scope: project-specific
    classification: repository-implemented
    source:
      type: github
      repository: gunnchOS3k/waike-research-ops
      branch: main
      commit: "8eb2827dc58ffa391842da1bfb1ee665c25a31a7"
      path: curriculum/digital_rc/COMPUTER_NETWORKING/course.json
      lines: ""
      supporting_paths:
        - curriculum/catalog.yaml
        - curriculum/digital_rc/GAME_DEV_INTERACTIVE/course.json
        - curriculum/digital_rc/EMBEDDED_PROTOTYPING/course.json
        - curriculum/digital_rc/SOFTWARE_BUILDER/course.json
        - src/waike_course_ready/
    verification:
      method: "accepted-main course.json + catalog inspection"
      command: "gh api repos/gunnchOS3k/waike-research-ops/commits/main"
      result: "SHA 8eb2827... audited 2026-09-02"
    limitations:
      - "No literal UI tap-to-response lab ID exists in WAIKE."
      - "README package-count text may be stale relative to on-disk count."
    wording:
      approved: "WAIKE provides file-backed digital course packages and validators on accepted main."
      prohibited: ["WAIKE includes an official Trace One Tap course module"]
    status: verified

