# Standalone Chapter 18 render project (does not affect root book `_quarto.yml`).
project:
  type: default
  output-dir: ../../../preview
  render:
    - chapter.md

bibliography: ../../references/references.bib
link-citations: true

format:
  html:
    toc: true
    embed-resources: true
  pdf:
    documentclass: scrartcl
    pdf-engine: xelatex
  epub:
    toc: true
