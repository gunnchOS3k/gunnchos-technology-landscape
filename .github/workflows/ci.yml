name: ci
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Python
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install pyyaml pytest
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.7.32"
      - name: Install TeX (TinyTeX) and SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          # TinyTeX download can 500 transiently; retry a few times.
          for i in 1 2 3 4 5; do
            if quarto install tinytex --no-prompt; then
              exit 0
            fi
            echo "TinyTeX install attempt $i failed; retrying..."
            sleep $((i * 5))
          done
          echo "TinyTeX install failed after retries" >&2
          exit 1
      - name: Validate
        run: make validate
      - name: Test
        run: make test
      - name: Full31 draft check (strict)
        run: make full31-draft-check FULL31_DRAFT_CHECK_MODE=strict
      - name: Full31 assets/reference check (strict)
        run: make full31-assets-check
      - name: Confirm NO_READER_EVIDENCE while responses empty
        run: |
          out="$(.venv/bin/python scripts/analyze_reader_feedback.py)"
          echo "$out"
          echo "$out" | grep -q 'NO_READER_EVIDENCE'
      - name: HTML render (CH02 preview package)
        run: make preview
      - name: EPUB render (CH02 preview package)
        run: make epub
      - name: PDF render (CH02 preview package)
        run: make pdf
      - name: Full31 HTML book
        run: make full31-html
      - name: Full31 EPUB book
        run: make full31-epub
      - name: Official EPUBCheck (pinned W3C)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
          make full31-epubcheck
      - name: Full31 PDF book
        run: make full31-pdf
      - name: Full31 publication QA
        run: make full31-publication-qa
      - name: Full31 quality / continuity / terminology / pre-review
        run: |
          make full31-quality-audit
          make full31-continuity-check
          make full31-terminology-check
          make full31-pre-review-check
      - name: Publication-family checks
        run: |
          make publication-family-check
          make distribution-requirements-check
          make adult-release-package-check
          make adult-artifact-package-check
          make print-profile-check
          make kids-standards-check
          make kids-standards-research-complete-check
          make kids-pilot-mapped-check
          make kids-media-evidence-check
          make kids-concept-spiral-check
          make kids-pilot-check
          make kids-review-prototype-check
          make kids-epubcheck
      - name: Confirm evidence sentinels
        run: |
          out="$(.venv/bin/python scripts/check_publication_family.py)"
          echo "$out"
          # Explicit honesty banners must remain in kids + adult package docs
          grep -R -l "NOT CHILD-VALIDATED\|NO_CHILD_VALIDATION" kids/ >/dev/null
          grep -R -l "NOT_SUBMITTED\|not submitted\|Do not actually upload\|HUMAN_CHECKLIST" release-packages/adult/ >/dev/null
          # Fail if a child-validation evidence artifact name appears
          if find kids \( -iname '*child*validat*' -o -iname '*reader*evidence*kids*' \) 2>/dev/null | grep -qi .; then
            echo "Forbidden child-validation evidence artifact found" >&2
            find kids \( -iname '*child*validat*' -o -iname '*reader*evidence*kids*' \)
            exit 1
          fi
          # Standards certification claims must remain absent (allow explicit forbid/non-claim lists)
          .venv/bin/python - <<'PY'
          import re
          from pathlib import Path
          roots = [Path("kids/standards"), Path("publication/family")]
          pat = re.compile(r"officially aligned|standards[- ]certified|STANDARDS_CERTIFICATION_EVIDENCE", re.I)
          allow = re.compile(
              r"(?i)(not[:\s]|never |no_|forbidden|non-claim|reject|do not|≠|must remain absent|"
              r"AUTHORITY_CLAIMS:|Forbidden claim)"
          )
          bad = []
          for root in roots:
              for path in list(root.rglob("*.md")) + list(root.rglob("*.yaml")):
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for m in pat.finditer(text):
                      window = text[max(0, m.start() - 120) : m.end() + 80]
                      if allow.search(window):
                          continue
                      bad.append(f"{path}:{text.count(chr(10), 0, m.start())+1}: {m.group(0)}")
          if bad:
              print("Forbidden standards-certification claim language found", flush=True)
              print("\n".join(bad), flush=True)
              raise SystemExit(1)
          print("standards-certification sentinel: OK")
          PY
          echo "NO_READER_EVIDENCE"
          echo "NO_CHILD_VALIDATION_EVIDENCE"
          echo "NO_RETAILER_SUBMISSION_EVIDENCE"
          echo "NO_STANDARDS_CERTIFICATION_EVIDENCE"
          echo "evidence sentinels: OK"
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-preview
          path: |
            preview/ch02.html
            preview/ch02.epub
            preview/ch02.pdf
          if-no-files-found: error
      - name: Upload full31 book artifacts
        uses: actions/upload-artifact@v4
        with:
          name: technology-landscape-full31
          path: |
            preview/full31/technology-landscape-full31-html
            preview/full31/technology-landscape-full31-pdf.pdf
            preview/full31/technology-landscape-full31-epub.epub
          if-no-files-found: error
