name: ci
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install pyyaml pytest
      - name: Validate
        run: make validate
      - name: Test
        run: make test
      - name: Preview
        run: make preview
