<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img"
     aria-labelledby="tmpl-title tmpl-desc"
     data-template-id="tmpl-hierarchy-resource-ladder"
     data-figure-family="hierarchy_resource_ladder">
  <title id="tmpl-title">TEMPLATE - Hierarchy / resource ladder</title>
  <desc id="tmpl-desc">Reusable stepped pyramid or ladder. Position encodes closeness/strength; rung numbers and labels carry meaning without color-only cues. No invented numeric capacities.</desc>
  <rect width="720" height="560" fill="#ffffff"/>
  <rect x="1" y="1" width="718" height="558" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">TEMPLATE - Hierarchy / resource ladder</text>
  <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Rung numbers + qualitative adjectives; no fake ns / MB claims</text>
  <rect x="260" y="80" width="200" height="50" fill="#fafafa" stroke="#111111" stroke-width="1.75"/>
  <text x="360" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">1 Tiny / fastest</text>
  <text x="360" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">closest to compute</text>
  <rect x="220" y="150" width="280" height="50" fill="#f0f0f0" stroke="#111111" stroke-width="1.75"/>
  <text x="360" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">2 Small / fast</text>
  <text x="360" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">cache-like</text>
  <rect x="170" y="220" width="380" height="50" fill="#e4e4e4" stroke="#111111" stroke-width="1.75"/>
  <text x="360" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">3 Medium / working set</text>
  <text x="360" y="258" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">volatile working memory</text>
  <rect x="110" y="290" width="500" height="50" fill="#d8d8d8" stroke="#111111" stroke-width="1.75"/>
  <text x="360" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">4 Large / durable home</text>
  <text x="360" y="328" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">persistent storage</text>
  <rect x="60" y="360" width="600" height="50" fill="#cccccc" stroke="#111111" stroke-width="1.75"/>
  <text x="360" y="380" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">5 Broadest / slowest access</text>
  <text x="360" y="398" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">optional remote / archive</text>
  <text x="24" y="460" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Encoding: rung number + size step + text adjectives. Color never sole cue.</text>
  <text x="24" y="490" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Also usable as evidence-strength ladder (illustrative to measured to standards).</text>
  <text x="24" y="530" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence note placeholder; caption draft placeholder</text>
</svg>
