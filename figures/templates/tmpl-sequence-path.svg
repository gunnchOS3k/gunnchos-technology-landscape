<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img"
     aria-labelledby="tmpl-title tmpl-desc"
     data-template-id="tmpl-sequence-path"
     data-figure-family="sequence_path">
  <title id="tmpl-title">TEMPLATE - Sequence / path diagram</title>
  <desc id="tmpl-desc">Reusable horizontal swimlanes with numbered steps. Semantics encoded by lane labels and step numbers, not color alone.</desc>
  <defs>
    <marker id="tmpl-seq-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect width="1040" height="480" fill="#ffffff"/>
  <rect x="1" y="1" width="1038" height="478" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">TEMPLATE - Sequence / path diagram</text>
  <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Numbered steps across swimlanes; decision diamonds optional; no fake timings</text>
  <text x="24" y="110" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Lane A</text>
  <line x1="100" y1="106" x2="1000" y2="106" stroke="#dddddd" stroke-width="1"/>
  <text x="24" y="190" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Lane B</text>
  <line x1="100" y1="186" x2="1000" y2="186" stroke="#dddddd" stroke-width="1"/>
  <text x="24" y="270" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Lane C</text>
  <line x1="100" y1="266" x2="1000" y2="266" stroke="#dddddd" stroke-width="1"/>
  <text x="24" y="350" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Lane D</text>
  <line x1="100" y1="346" x2="1000" y2="346" stroke="#dddddd" stroke-width="1"/>
  <rect x="140" y="80" width="100" height="40" fill="#f5f5f5" stroke="#111111" stroke-width="1.5"/>
  <text x="190" y="104" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">1 Start</text>
  <line x1="240" y1="100" x2="300" y2="160" stroke="#111111" stroke-width="1.75" marker-end="url(#tmpl-seq-arr)"/>
  <rect x="300" y="160" width="110" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="355" y="184" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">2 Process</text>
  <line x1="410" y1="180" x2="470" y2="240" stroke="#111111" stroke-width="1.75" marker-end="url(#tmpl-seq-arr)"/>
  <rect x="470" y="240" width="110" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="525" y="264" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">3 Execute</text>
  <line x1="580" y1="260" x2="640" y2="320" stroke="#111111" stroke-width="1.75" marker-end="url(#tmpl-seq-arr)"/>
  <rect x="640" y="320" width="110" height="40" fill="#f5f5f5" stroke="#111111" stroke-width="1.5"/>
  <text x="695" y="344" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">4 Feedback</text>
  <path d="M800,100 L840,140 L800,180 L760,140 Z" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="800" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111">gate?</text>
  <text x="24" y="420" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Encoding: lane labels + step numbers (+ diamond = decision). Color never sole cue.</text>
  <text x="24" y="450" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence note placeholder; caption draft placeholder</text>
</svg>
