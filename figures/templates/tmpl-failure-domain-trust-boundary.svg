<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"
     aria-labelledby="tmpl-title tmpl-desc"
     data-template-id="tmpl-failure-domain-trust-boundary"
     data-figure-family="failure_domain_trust_boundary">
  <title id="tmpl-title">TEMPLATE - Failure domain / trust boundary</title>
  <desc id="tmpl-desc">Symptom to domain to evidence-still-needed columns, or nested trust boundaries. Icons and text labels encode meaning; color never sole cue. Does not claim root cause.</desc>
  <rect width="1000" height="480" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="478" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">TEMPLATE - Failure domain / trust boundary</text>
  <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Map symptoms to domains without inventing root cause; evidence column required</text>
  <rect x="40" y="80" width="280" height="40" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="180" y="105" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">Symptom (observed)</text>
  <rect x="360" y="80" width="280" height="40" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="105" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">Failure domain (hypothesis)</text>
  <rect x="680" y="80" width="280" height="40" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="820" y="105" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">Evidence still needed</text>
  <rect x="40" y="140" width="280" height="60" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="180" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Spinner forever</text>
  <rect x="360" y="140" width="280" height="60" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Service / network path</text>
  <rect x="680" y="140" width="280" height="60" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="820" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1F4B7A">timing / reachability logs</text>
  <rect x="40" y="220" width="280" height="60" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="180" y="255" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Lag with healthy icon</text>
  <rect x="360" y="220" width="280" height="60" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="255" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Local compute / memory</text>
  <rect x="680" y="220" width="280" height="60" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="820" y="255" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1F4B7A">CPU/mem monitor snapshot</text>
  <rect x="40" y="320" width="920" height="80" fill="#fafafa" stroke="#111111" stroke-width="1.5"/>
  <text x="60" y="350" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Trust / boundary variant:</text>
  <text x="60" y="372" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Device endpoint | Transit encryption | Service trust | Human permission - each boundary labeled in words</text>
  <text x="24" y="440" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Encoding: column structure + dashed = pending evidence. Healthy connectivity icon != usable experience.</text>
  <text x="24" y="464" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence note placeholder; caption draft placeholder</text>
</svg>
