<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img"
     aria-labelledby="tmpl-title tmpl-desc"
     data-template-id="tmpl-ecosystem-system-map"
     data-figure-family="ecosystem_system_map">
  <title id="tmpl-title">TEMPLATE - Ecosystem / system map</title>
  <desc id="tmpl-desc">Reusable left-to-right swimlane: Person to visible interface to local system to optional network/service (dashed) to human-usable result. Color is not the sole encoding; solid vs dashed stroke marks required vs optional.</desc>
  <defs>
    <marker id="tmpl-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
    <marker id="tmpl-arr-opt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1F4B7A"/>
    </marker>
  </defs>
  <rect width="1040" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="1038" height="418" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">TEMPLATE - Ecosystem / system map</text>
  <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Replace nodes/labels; keep solid=required, dashed=optional; truth_classification in status line</text>
  <rect x="24" y="160" width="130" height="70" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="89" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">1 Person</text>
  <line x1="154" y1="195" x2="178" y2="195" stroke="#111111" stroke-width="2" marker-end="url(#tmpl-arr)"/>
  <rect x="180" y="160" width="140" height="70" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="250" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">2 Interface</text>
  <line x1="320" y1="195" x2="344" y2="195" stroke="#111111" stroke-width="2" marker-end="url(#tmpl-arr)"/>
  <rect x="346" y="150" width="150" height="90" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="421" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">3 Local system</text>
  <text x="421" y="210" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">hidden work</text>
  <path d="M496,170 C540,90 600,80 660,90" fill="none" stroke="#1F4B7A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tmpl-arr-opt)"/>
  <rect x="590" y="40" width="160" height="56" fill="#ffffff" stroke="#1F4B7A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="670" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1F4B7A">OPTIONAL</text>
  <text x="670" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Network / service</text>
  <path d="M750,90 C800,120 820,150 820,170" fill="none" stroke="#1F4B7A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tmpl-arr-opt)"/>
  <path d="M496,210 L496,280 L820,280 L820,230" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#tmpl-arr)"/>
  <text x="658" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">local path (skip optional)</text>
  <rect x="820" y="160" width="90" height="70" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="865" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">4 Result</text>
  <line x1="910" y1="195" x2="934" y2="195" stroke="#111111" stroke-width="2" marker-end="url(#tmpl-arr)"/>
  <rect x="936" y="160" width="80" height="70" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="976" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">5 Usable</text>
  <line x1="24" y1="360" x2="64" y2="360" stroke="#111111" stroke-width="2"/>
  <text x="72" y="364" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">solid = required</text>
  <line x1="200" y1="360" x2="240" y2="360" stroke="#1F4B7A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="248" y="364" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">dashed = optional branch</text>
  <text x="24" y="396" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence note placeholder; caption draft placeholder; no invented measurements</text>
</svg>
