figure_id: FIG-CH26-003
title: "Secrets must not enter the repository"
caption: "Working-tree edits may contain secrets; a refuse-line blocks credentials, tokens, and keys from history. Conceptual teaching boundary."
alt_text: "FIG-CH26-003: Working tree to secrets-scan refuse-line, then blocked from history or allowed into commit without secrets."
text_equivalent: |
  FIG-CH26-003 reading order: (1) Working tree — edits on disk may still hold secrets,
  (2) Secrets scan (human) refuse-line — passwords, API tokens, private keys,
  (3a) Blocked from history — do not commit / do not push (dashed),
  (3b) Allowed into commit — reviewable code/docs without secrets.
  Once committed, assume secrets may already be copied.
reading_order:
- Working tree
- Secrets scan refuse-line
- Blocked from history
- Allowed into commit
