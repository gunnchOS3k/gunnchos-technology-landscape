figure_id: FIG-CH02-005
title: "Local vs Network-Dependent Tap"
caption: "Compare-and-choose plate: local-only action versus network-dependent action."
alt_text: "Two columns: local-only path versus network-dependent path sharing Human Input OS prefix then splitting."
text_equivalent: |
  Shared prefix stages Human → Input → OS, then a split. Left LOCAL-ONLY column: Application →
  Renderer → Perception, annotated cache hit · nearby (on device). Right NETWORK-DEPENDENT column:
  Application → Packets/API → Access network → Remote service (dashed borders and arrows), annotated
  cloud · far (RTT + service), then rejoins at Renderer/Perception. Solid = on-device; dashed = network.
