title: "Cross-Layer Tap Sequence"
caption: "Cross-layer sequence for a tap with optional remote path and failure branch. Conceptual; durations illustrative where shown."
alt_text: "Sequence diagram of actors exchanging events for a tap, including optional network and failure branches."
text_equivalent: |
  Actors: Human, Input hardware, OS, Application, Network, Service, Renderer. The happy path moves downward through messages. A side branch shows network/service failure while local visual feedback may still succeed. Any timing labels are illustrative, not measured benchmarks.
