figure_id: FIG-CH02-002
title: "Cross-Layer Tap Sequence"
caption: "Cross-layer sequence for a tap with optional remote path and failure branch. Conceptual; durations illustrative where shown."
alt_text: "Sequence diagram: Human, Input HW, OS, Application, Network, Service, Renderer with message arrows and failure branch."
text_equivalent: |
  Real sequence diagram with seven actor columns and vertical dashed lifelines: Human, Input HW, OS,
  Application, Network, Service, Renderer. Solid message arrows: (1) tap/contact, (2) input event,
  (3) deliver to app, (4) local state update, (6) present frame, (7) visible feedback. Dashed optional
  path (5) reaches Network and Service with OK response or a dashed failure/retry return marked with
  an X at the service. Network and Service headers use dashed borders. Not a vertical list of rows.
reading_order:
  - "Actor columns: Human, Input HW, OS, Application, Network, Service, Renderer"
  - "1 tap / contact — Human to Input HW"
  - "2 input event — Input HW to OS"
  - "3 deliver to app — OS to Application"
  - "4 local state — Application"
  - "5 OPTIONAL request — Application to Network to Service"
  - "response OK or failure/retry with X"
  - "6 present frame — Application to Renderer"
  - "7 visible feedback — Renderer to Human"
