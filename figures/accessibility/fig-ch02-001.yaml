figure_id: FIG-CH02-001
title: "One Tap: Human-to-System Overview"
caption: "A first-time-reader map of one tap from human intent to human-visible result. Conceptual educational diagram."
alt_text: "End-to-end experience map: Human to input to software to optional network to output to perception."
text_equivalent: |
  Six stages left to right: (1) Human, (2) Input hardware, (3) System software and Application,
  (4) Optional Network/Service on a dashed OPTIONAL branch, (5) Output/renderer, (6) Human perception.
  Solid line arrows connect the main path; dashed stroke-dasharray lines mark the optional network
  branch that can be skipped via a solid local path underneath. Status: Conceptual educational diagram.
reading_order:
  - "1 Human — intent / tap"
  - "2 Input hardware — senses contact"
  - "3 Software — Application over System software"
  - "4 OPTIONAL Network / Service (dashed branch)"
  - "local path (skip network)"
  - "5 Output — renderer / display"
  - "6 Perception — human sees result"
