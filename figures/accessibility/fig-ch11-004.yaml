figure_id: FIG-CH11-004
title: "Update failure → recovery → outcomes"
caption: "Trusted update can interrupt; recovery may restore a usable device or leave an unusable outcome. Conceptual Stability Contract teaching—not vendor brick statistics."
alt_text: "FIG-CH11-004: Trusted update to interrupted update to recovery path, then usable restored or unusable outcome."
text_equivalent: |
  FIG-CH11-004 reading order: (1) Trusted update — signed/expected path,
  (2) Interrupted update — power loss/abort/mismatch (dashed),
  (3) Recovery path — rollback/rescue/reflash,
  (4a) Usable restored — device boots; human can continue,
  (4b) Unusable outcome — stuck/unbootable/needs external rescue (dashed).
  Formal interrupted-update claims remain SOURCE_NEEDED. Quartet measured update/recovery = PHYSICAL_PENDING.
