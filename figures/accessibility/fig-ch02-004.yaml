figure_id: FIG-CH02-004
title: "Software Stack"
caption: "Software stack supporting a tap-to-response path. Conceptual layering; real systems vary."
alt_text: "Software stack layers Application through Hardware with upward event arrows and downward output arrows."
text_equivalent: |
  Vertical stack of layered rectangles from top to bottom: Application, Runtime/framework,
  Libraries/system services, Kernel, Drivers, Firmware, Hardware. A solid accent arrow on the left
  points upward labeled events (tap rises). A solid black arrow on the right points downward labeled
  output (frame descends). Alternating fills plus layer names encode position.
