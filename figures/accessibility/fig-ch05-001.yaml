title: "Press to Logic Flow"
caption: "Human press through electrical change, signal, clocked logic, and perceptible effect. Conceptual educational diagram."
alt_text: "Left-to-right causal flow: Press; Electrical change; Signal; Clocked logic; Effect."
text_equivalent: |
  Five stages left to right: (1) Press — human action; (2) Electrical — voltage/energy;
  (3) Signal — information over time; (4) Clocked logic — timed decisions (dashed border for sync path);
  (5) Effect — person notices. Solid arrows connect stages. Not measured Device Quartet telemetry.
