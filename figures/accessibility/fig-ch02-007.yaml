figure_id: FIG-CH02-007
title: "Stability Contract"
caption: "Stability Contract: hidden conditions behind a successful tap experience."
alt_text: "Stability Contract: central Human experience succeeds node connected to eight concurrent condition chips."
text_equivalent: |
  Central ellipse labeled Human experience succeeds with ALL conditions must hold, connected by lines
  to eight surrounding condition chips: Touch recognized, Event delivered, App scheduled, Handler
  completes, Memory available, Network/service if needed (dashed optional chip), Frame reaches
  display, Delay acceptable. Layout shows concurrency — conditions hold together; any one failure
  can break the experience. Not a numbered checklist alone.
