title: "Stability Contract"
caption: "Stability Contract: hidden conditions behind a successful tap experience."
alt_text: "Diagram of hidden conditions that must stay good enough for a successful tap experience."
text_equivalent: |
  A central human experience node surrounded by condition chips. If any required chip fails, the experience can fail even when other chips succeed. Teaches that connected is not the same as usable.
