<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-label="Exploded educational device: cover, digitizer, board, CPU, GPU, RAM, storage, radio, battery, thermal, input.">
  <title>FIG-CH02-003: Representative Device Exploded View</title>
  <desc>Spatially exploded educational device with vertically separated isometric-ish rectangles: cover/display, digitizer, board/SoC, CPU, GPU, RAM, storage, radio, battery/power, thermal path, and input hardware. Each part has a label with name, short role, and failure symptom. Banner text reads Representative educational architecture. Does not imply a validated gunnchOS EVT unit.</desc>

  <rect width="980" height="720" fill="#ffffff"/>
  <rect x="1" y="1" width="978" height="718" fill="none" stroke="#222222" stroke-width="2"/>

  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#111111">FIG-CH02-003 — Representative Device Exploded View</text>
  <!-- Banner -->
  <rect x="24" y="44" width="340" height="26" fill="#1F4B7A"/>
  <text x="34" y="62" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Representative educational architecture</text>
  <text x="380" y="62" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666666">Not a validated gunnchOS EVT · conceptual teaching model</text>

  <!-- Helper: isometric-ish plate = parallelogram via path -->
  <!-- Layer plates stacked with offset, labels to the right -->

  <!-- 1 Cover/display -->
  <g transform="translate(180,90)">
    <path d="M40,0 L280,0 L300,22 L60,22 Z" fill="#f0f0f0" stroke="#111111" stroke-width="1.75"/>
    <path d="M40,0 L60,22 L60,34 L40,12 Z" fill="#d8d8d8" stroke="#111111" stroke-width="1"/>
    <path d="M280,0 L300,22 L300,34 L280,12 Z" fill="#c8c8c8" stroke="#111111" stroke-width="1"/>
    <path d="M60,22 L300,22 L300,34 L60,34 Z" fill="#e8e8e8" stroke="#111111" stroke-width="1"/>
  </g>
  <line x1="500" y1="108" x2="560" y2="108" stroke="#888888" stroke-width="1"/>
  <text x="568" y="100" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Cover / display</text>
  <text x="568" y="116" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Role: pixels out · Fail: blank / dead pixels</text>

  <!-- 2 Digitizer -->
  <g transform="translate(170,140)">
    <path d="M40,0 L280,0 L300,22 L60,22 Z" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
    <path d="M40,0 L60,22 L60,34 L40,12 Z" fill="#d0d0d0" stroke="#111111" stroke-width="1"/>
    <path d="M280,0 L300,22 L300,34 L280,12 Z" fill="#bdbdbd" stroke="#111111" stroke-width="1"/>
    <path d="M60,22 L300,22 L300,34 L60,34 Z" fill="#ececec" stroke="#111111" stroke-width="1"/>
    <line x1="90" y1="8" x2="250" y2="8" stroke="#1F4B7A" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="90" y1="14" x2="250" y2="14" stroke="#1F4B7A" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  <line x1="490" y1="158" x2="560" y2="158" stroke="#888888" stroke-width="1"/>
  <text x="568" y="150" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Digitizer</text>
  <text x="568" y="166" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Role: touch sense · Fail: missed / ghost taps</text>

  <!-- 3 Board / SoC -->
  <g transform="translate(160,190)">
    <path d="M40,0 L280,0 L300,28 L60,28 Z" fill="#eaeaea" stroke="#111111" stroke-width="1.75"/>
    <path d="M40,0 L60,28 L60,42 L40,14 Z" fill="#c4c4c4" stroke="#111111" stroke-width="1"/>
    <path d="M280,0 L300,28 L300,42 L280,14 Z" fill="#b0b0b0" stroke="#111111" stroke-width="1"/>
    <path d="M60,28 L300,28 L300,42 L60,42 Z" fill="#dcdcdc" stroke="#111111" stroke-width="1"/>
    <rect x="120" y="6" width="80" height="16" fill="#ffffff" stroke="#111111" stroke-width="1"/>
    <text x="160" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#111111">board / SoC</text>
  </g>
  <line x1="480" y1="214" x2="560" y2="214" stroke="#888888" stroke-width="1"/>
  <text x="568" y="206" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Board / SoC</text>
  <text x="568" y="222" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Role: compute hub · Fail: boot hang / reset</text>

  <!-- 4 CPU + 5 GPU side by side chips -->
  <g transform="translate(200,258)">
    <rect x="0" y="0" width="70" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
    <text x="35" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">CPU</text>
    <text x="35" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#555555">execute</text>
    <rect x="100" y="0" width="70" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
    <text x="135" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">GPU</text>
    <text x="135" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#555555">compose</text>
  </g>
  <line x1="380" y1="270" x2="560" y2="270" stroke="#888888" stroke-width="1"/>
  <text x="568" y="262" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">CPU · GPU</text>
  <text x="568" y="278" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Fail: stalls / jank · Fail: frame drops</text>

  <!-- 6 RAM -->
  <g transform="translate(190,320)">
    <rect x="0" y="0" width="200" height="28" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
    <line x1="25" y1="4" x2="25" y2="24" stroke="#888" stroke-width="1"/>
    <line x1="50" y1="4" x2="50" y2="24" stroke="#888" stroke-width="1"/>
    <line x1="75" y1="4" x2="75" y2="24" stroke="#888" stroke-width="1"/>
    <line x1="100" y1="4" x2="100" y2="24" stroke="#888" stroke-width="1"/>
    <line x1="125" y1="4" x2="125" y2="24" stroke="#888" stroke-width="1"/>
    <line x1="150" y1="4" x2="150" y2="24" stroke="#888" stroke-width="1"/>
    <line x1="175" y1="4" x2="175" y2="24" stroke="#888" stroke-width="1"/>
    <text x="100" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111">RAM</text>
  </g>
  <line x1="400" y1="334" x2="560" y2="334" stroke="#888888" stroke-width="1"/>
  <text x="568" y="326" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">RAM</text>
  <text x="568" y="342" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Role: working set · Fail: OOM / thrash</text>

  <!-- 7 Storage -->
  <g transform="translate(210,370)">
    <rect x="0" y="0" width="160" height="32" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
    <circle cx="20" cy="16" r="6" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">Storage</text>
  </g>
  <line x1="380" y1="386" x2="560" y2="386" stroke="#888888" stroke-width="1"/>
  <text x="568" y="378" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Storage</text>
  <text x="568" y="394" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Role: persist · Fail: corrupt / slow I/O</text>

  <!-- 8 Radio -->
  <g transform="translate(240,424)">
    <rect x="0" y="0" width="100" height="36" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="5 3"/>
    <path d="M70,10 Q90,18 70,26" fill="none" stroke="#1F4B7A" stroke-width="1.5"/>
    <path d="M78,6 Q105,18 78,30" fill="none" stroke="#1F4B7A" stroke-width="1.5"/>
    <text x="40" y="22" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">Radio</text>
  </g>
  <line x1="350" y1="442" x2="560" y2="442" stroke="#888888" stroke-width="1"/>
  <text x="568" y="434" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Radio</text>
  <text x="568" y="450" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Role: link out · Fail: drop / timeout</text>

  <!-- 9 Battery / power -->
  <g transform="translate(200,482)">
    <rect x="0" y="4" width="140" height="36" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
    <rect x="140" y="14" width="10" height="16" fill="#111111"/>
    <rect x="8" y="12" width="90" height="20" fill="#dddddd" stroke="#111111" stroke-width="1"/>
    <text x="70" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#111111">Battery / power</text>
  </g>
  <line x1="360" y1="504" x2="560" y2="504" stroke="#888888" stroke-width="1"/>
  <text x="568" y="496" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Battery / power</text>
  <text x="568" y="512" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Role: energy · Fail: brownout / shutdown</text>

  <!-- 10 Thermal path -->
  <g transform="translate(160,546)">
    <path d="M0,20 L40,0 L280,0 L320,20 L280,40 L40,40 Z" fill="none" stroke="#111111" stroke-width="1.75" stroke-dasharray="6 3"/>
    <text x="160" y="24" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">Thermal path</text>
  </g>
  <line x1="490" y1="566" x2="560" y2="566" stroke="#888888" stroke-width="1"/>
  <text x="568" y="558" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Thermal path</text>
  <text x="568" y="574" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Role: heat out · Fail: throttle / heat kill</text>

  <!-- 11 Input hardware (side module) -->
  <g transform="translate(40,280)">
    <rect x="0" y="0" width="90" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
    <circle cx="45" cy="30" r="12" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="20" y="55" width="50" height="14" fill="#e8e8e8" stroke="#111111" stroke-width="1"/>
    <rect x="20" y="78" width="50" height="14" fill="#e8e8e8" stroke="#111111" stroke-width="1"/>
    <text x="45" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#111111">Input HW</text>
  </g>
  <text x="40" y="420" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">Input hardware</text>
  <text x="40" y="436" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#444444">Role: buttons / sensors</text>
  <text x="40" y="450" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#444444">Fail: stuck / mute</text>

  <!-- Explosion axis -->
  <line x1="150" y1="80" x2="150" y2="600" stroke="#cccccc" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="24" y="700" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666666">Spatially exploded for teaching · dashed outline = thermal / radio optional link path</text>
</svg>
