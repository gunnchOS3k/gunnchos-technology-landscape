<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-label="Two columns: local-only path versus network-dependent path sharing Human Input OS prefix then splitting." data-figure-id="FIG-CH02-005">
  <title>FIG-CH02-005: Local vs Network-Dependent Tap</title>
  <desc>Two columns share a common prefix of Human, Input, and OS. The left Local-only column continues through Application to Renderer. The right Network-dependent column continues through Application, packets, access network, and remote Service, then rejoins at Renderer. Annotations mark cache hit nearby on the left and cloud far on the right. Solid connectors for required stages; dashed strokes for network stages.</desc>
  <defs>
    <marker id="arr005" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#111111"/>
    </marker>
    <marker id="arr005d" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1F4B7A"/>
    </marker>
  </defs>

  <rect width="1040" height="560" fill="#ffffff"/>
  <rect x="1" y="1" width="1038" height="558" fill="none" stroke="#222222" stroke-width="2"/>

  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#111111">FIG-CH02-005 — Local vs Network-Dependent Tap</text>
  <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#444444">Status: Conceptual educational diagram · Compare-and-choose plate</text>

  <!-- Shared prefix -->
  <rect x="320" y="70" width="400" height="28" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="520" y="64" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#555555">SHARED PREFIX</text>

  <rect x="380" y="78" width="100" height="44" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="430" y="104" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Human</text>

  <line x1="480" y1="100" x2="508" y2="100" stroke="#111111" stroke-width="1.75" marker-end="url(#arr005)"/>

  <rect x="510" y="78" width="100" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="560" y="104" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Input</text>

  <line x1="560" y1="122" x2="560" y2="148" stroke="#111111" stroke-width="1.75" marker-end="url(#arr005)"/>

  <rect x="510" y="150" width="100" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="560" y="176" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">OS</text>

  <!-- Split -->
  <path d="M510,172 L280,172 L280,210" fill="none" stroke="#111111" stroke-width="1.75" marker-end="url(#arr005)"/>
  <path d="M610,172 L840,172 L840,210" fill="none" stroke="#111111" stroke-width="1.75" marker-end="url(#arr005)"/>
  <text x="520" y="210" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">split</text>

  <!-- LEFT: Local-only -->
  <rect x="120" y="220" width="320" height="280" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="120" y="220" width="320" height="28" fill="#111111"/>
  <text x="280" y="239" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">LOCAL-ONLY</text>

  <rect x="190" y="268" width="180" height="40" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="280" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Application</text>

  <line x1="280" y1="308" x2="280" y2="336" stroke="#111111" stroke-width="1.75" marker-end="url(#arr005)"/>

  <rect x="190" y="338" width="180" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="280" y="362" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Renderer</text>

  <line x1="280" y1="378" x2="280" y2="406" stroke="#111111" stroke-width="1.75" marker-end="url(#arr005)"/>

  <rect x="190" y="408" width="180" height="40" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="280" y="432" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Perception</text>

  <!-- Cache hit nearby annotation -->
  <rect x="150" y="460" width="260" height="28" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.25"/>
  <text x="280" y="479" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1F4B7A">cache hit · nearby (on device)</text>

  <!-- RIGHT: Network-dependent -->
  <rect x="600" y="220" width="320" height="280" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="600" y="220" width="320" height="28" fill="#1F4B7A"/>
  <text x="760" y="239" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">NETWORK-DEPENDENT</text>

  <rect x="670" y="260" width="180" height="32" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="760" y="280" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">Application</text>

  <line x1="760" y1="292" x2="760" y2="312" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="5 3" marker-end="url(#arr005d)"/>

  <rect x="670" y="314" width="180" height="32" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="5 3"/>
  <text x="760" y="334" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">Packets / API</text>

  <line x1="760" y1="346" x2="760" y2="366" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="5 3" marker-end="url(#arr005d)"/>

  <rect x="670" y="368" width="180" height="32" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="5 3"/>
  <text x="760" y="388" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">Access network</text>

  <line x1="760" y1="400" x2="760" y2="420" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="5 3" marker-end="url(#arr005d)"/>

  <rect x="670" y="422" width="180" height="32" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="5 3"/>
  <text x="760" y="442" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">Remote service</text>

  <!-- Rejoin note -->
  <path d="M760,454 L760,470 L520,470 L520,500" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arr005)"/>
  <path d="M280,448 L280,470" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="520" y="528" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">rejoin · Renderer / Perception</text>

  <rect x="640" y="460" width="240" height="28" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.25" stroke-dasharray="4 2"/>
  <text x="760" y="479" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1F4B7A">cloud · far (RTT + service)</text>

  <text x="24" y="548" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666666">Solid stages = on-device · Dashed stages = network path · Both paths share Human → Input → OS</text>
</svg>
