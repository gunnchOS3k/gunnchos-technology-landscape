<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title002 desc002" data-figure-id="FIG-CH09-002">
  <title id="title002">FIG-CH09-002: On Charger vs On Battery</title>
  <desc id="desc002">Two columns. Left: same app on charger in a cool room with smooth scroll cue. Right: same app on battery in a warm room with hitch and dim cues. Center label: same software, different budget. Status: Illustrative teaching aid. No invented watt or degree numbers.</desc>
  <rect width="1040" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="1038" height="418" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="28" y="34" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#111111">FIG-CH09-002  On Charger vs On Battery</text>
  <text x="28" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#444444">Status: Illustrative teaching aid · No fabricated watt/°C product curves · Color is not the sole encoding</text>

  <rect x="40" y="90" width="440" height="280" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="260" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">A · On charger</text>
  <text x="260" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">cool room · wall power</text>
  <rect x="120" y="170" width="280" height="120" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="260" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#111111">Familiar app</text>
  <text x="260" y="245" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#333333">scroll feels smooth</text>
  <text x="260" y="340" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Cue: plugged-in indicator</text>

  <rect x="560" y="90" width="440" height="280" fill="#ffffff" stroke="#111111" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="780" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">B · On battery</text>
  <text x="780" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">warm room · finite pack</text>
  <rect x="640" y="170" width="280" height="120" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="780" y="212" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#111111">Same app</text>
  <text x="780" y="236" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#333333">hitch · dim · warmer case</text>
  <text x="780" y="340" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Cues: battery mode / warmth (qualitative)</text>

  <text x="520" y="400" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1F4B7A">Same software · different energy/thermal budget</text>
</svg>
