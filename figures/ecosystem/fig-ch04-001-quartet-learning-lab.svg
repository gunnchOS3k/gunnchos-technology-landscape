<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="Four research form factors as a learning laboratory, not a product catalog.">
  <title>FIG-CH04-001: Device Quartet as Learning Laboratory</title>
  <desc>Four equal panels left to right: Student 14.5-inch desk; Handheld Hybrid mobile/docked; DS-XL Coder learn-to-build; Edge IO Wearables embodied sensing. Banner states research form factors, PHYSICAL_PENDING, not shipping SKUs. Conceptual educational diagram.</desc>
  <rect width="1100" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="1098" height="418" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="28" y="34" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#111111">FIG-CH04-001  Device Quartet as a Learning Laboratory</text>
  <text x="28" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#444444">Status: Conceptual · Research form factors · PHYSICAL_PENDING · Not a product catalog</text>

  <!-- Panel 1 -->
  <rect x="28" y="90" width="240" height="260" fill="#f7f7f7" stroke="#111111" stroke-width="2"/>
  <rect x="58" y="130" width="180" height="110" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="78" y="240" width="140" height="12" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="148" y="280" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">Student 14.53</text>
  <text x="148" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">desk / sustained work</text>
  <text x="148" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">shape: clamshell</text>

  <!-- Panel 2 -->
  <rect x="296" y="90" width="240" height="260" fill="#ffffff" stroke="#111111" stroke-width="2" stroke-dasharray="6 3"/>
  <rect x="350" y="125" width="70" height="120" rx="8" fill="#f7f7f7" stroke="#111111" stroke-width="2"/>
  <rect x="440" y="155" width="60" height="40" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="416" y="280" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">Handheld Hybrid</text>
  <text x="416" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">mobile / docked</text>
  <text x="416" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">stroke: dashed = hybrid</text>

  <!-- Panel 3 -->
  <rect x="564" y="90" width="240" height="260" fill="#f7f7f7" stroke="#111111" stroke-width="2"/>
  <rect x="594" y="120" width="180" height="130" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="610" y="140" width="90" height="70" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="710" y="140" width="48" height="70" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="684" y="280" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">DS-XL Coder</text>
  <text x="684" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">learn-to-build</text>
  <text x="684" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">shape: wide workspace</text>

  <!-- Panel 4 -->
  <rect x="832" y="90" width="240" height="260" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <circle cx="952" cy="170" r="34" fill="none" stroke="#111111" stroke-width="2"/>
  <circle cx="952" cy="170" r="10" fill="#111111"/>
  <rect x="920" y="220" width="64" height="28" rx="10" fill="#f7f7f7" stroke="#111111" stroke-width="2"/>
  <text x="952" y="280" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">Edge IO Wearables</text>
  <text x="952" y="302" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">embodied sensing</text>
  <text x="952" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">shape: ring / body-proximate</text>

  <text x="550" y="390" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Learning laboratory of constraints  not shipping SKUs · No fabricated watt / °C / FPS / RF numbers</text>
</svg>
