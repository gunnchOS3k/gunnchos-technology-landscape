<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="FIG-CH15-002-title FIG-CH15-002-desc" data-figure-id="FIG-CH15-002" data-truth-classification="conceptual">
  <title id="FIG-CH15-002-title">FIG-CH15-002: User to access network to edge versus regional cloud</title>
  <desc id="FIG-CH15-002-desc">Conceptual system map. Reading order: 1 User and device, 2 Access network labeled Wi-Fi or cellular, 3 Path toward service, then fork to 4a Edge placement or 4b Regional cloud placement. Access is not placement. Truth classification: conceptual. Color is not the sole encoding.</desc>
  <rect width="1100" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="1098" height="418" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH15-002  Access network ≠ edge/cloud placement</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Truth: conceptual · Placement ` access radio · Color is not the sole encoding</text>

  <defs>
    <marker id="arr15b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="40" y="150" width="150" height="100" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="115" y="185" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">1 User / device</text>
  <text x="115" y="210" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">felt experience</text>

  <line x1="190" y1="200" x2="230" y2="200" stroke="#111111" stroke-width="1.75" marker-end="url(#arr15b)"/>

  <rect x="230" y="140" width="200" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.75" stroke-dasharray="6 4"/>
  <text x="330" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">2 Access network</text>
  <text x="330" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#111111">Wi-Fi  OR  cellular</text>
  <text x="330" y="225" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">on-ramp  not cloud</text>

  <line x1="430" y1="200" x2="470" y2="200" stroke="#111111" stroke-width="1.75" marker-end="url(#arr15b)"/>

  <rect x="470" y="150" width="160" height="100" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="550" y="185" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">3 Path</text>
  <text x="550" y="210" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">toward service</text>

  <line x1="630" y1="175" x2="700" y2="120" stroke="#111111" stroke-width="1.75" marker-end="url(#arr15b)"/>
  <line x1="630" y1="225" x2="700" y2="280" stroke="#111111" stroke-width="1.75" marker-end="url(#arr15b)"/>

  <rect x="700" y="70" width="340" height="90" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="870" y="105" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">4a Edge placement</text>
  <text x="870" y="130" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">compute/state nearer to user</text>

  <rect x="700" y="240" width="340" height="90" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.75"/>
  <text x="870" y="275" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">4b Regional cloud placement</text>
  <text x="870" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">shared datacenter-style pool</text>

  <text x="24" y="360" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Dashed box = access layer. Solid boxes = placement choices. A cloud service can be reached over Wi-Fi or cellular; those are different layers.</text>
  <text x="24" y="385" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">Do not treat edge/cloud as synonyms for Wi-Fi/cellular. Quartet/edge benches remain PHYSICAL_PENDING.</text>
  <text x="24" y="405" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Conceptual educational map  not measured PoP latency evidence.</text>
</svg>
