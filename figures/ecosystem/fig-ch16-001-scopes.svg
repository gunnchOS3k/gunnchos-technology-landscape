<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="FIG-CH16-001-title FIG-CH16-001-desc" data-figure-id="FIG-CH16-001" data-truth-classification="conceptual">
  <title id="FIG-CH16-001-title">FIG-CH16-001: Local, LAN, and Internet are distinct reachability scopes.</title>
  <desc id="FIG-CH16-001-desc">Nested scopes labeled Device (local), LAN, and Internet. A request can stop inside LAN while Wi-Fi association remains. Conceptual teaching map; color is not the sole encoding.</desc>
  <rect width="800" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="798" height="418" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#111111" font-weight="bold">FIG-CH16-001  Local / LAN / Internet scopes</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: conceptual · inherit FIG-CE4-001 intent · color not sole encoding</text>
  <rect x="80" y="90" width="640" height="270" fill="#fafafa" stroke="#111111" stroke-width="1.75"/>
  <text x="100" y="118" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">Internet scope</text>
  <text x="100" y="136" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">multi-network reachability toward a named service</text>
  <rect x="140" y="150" width="520" height="180" fill="#f0f0f0" stroke="#111111" stroke-width="1.75"/>
  <text x="160" y="178" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">LAN scope</text>
  <text x="160" y="196" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">same local network / gateway neighborhood</text>
  <rect x="220" y="220" width="280" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="360" y="258" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">Device (local) scope</text>
  <text x="360" y="278" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">on-device apps, stack, NIC/radio</text>
  <text x="40" y="400" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Keep distinct: device ` LAN ` Internet. Wi-Fi association ` Internet usable.</text>
</svg>
