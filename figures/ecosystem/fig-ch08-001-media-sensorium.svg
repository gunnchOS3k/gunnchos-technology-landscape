<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img"
     aria-labelledby="title desc"
     data-figure-id="FIG-CH08-001"
     data-truth-classification="conceptual">
  <title id="title">FIG-CH08-001 Media sensorium map</title>
  <desc id="desc">Conceptual left-to-right map: physical world to sensors cameras and microphones to processing including compositor and GPU to display and speakers returning to human perception. Truth classification: conceptual.</desc>
  <rect width="1100" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="1098" height="418" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">FIG-CH08-001  World → sensing → processing → presentation</text>
  <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Conceptual educational map · not measured telemetry · shape+label encoding</text>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111111"/></marker>
  </defs>
  <rect x="24" y="150" width="150" height="90" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="99" y="185" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">1 Physical</text>
  <text x="99" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">world</text>
  <line x1="174" y1="195" x2="210" y2="195" stroke="#111111" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="212" y="130" width="180" height="130" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="302" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">2 Capture</text>
  <text x="302" y="182" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">cameras · mics</text>
  <text x="302" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">other sensors</text>
  <text x="302" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">sampling</text>
  <line x1="392" y1="195" x2="428" y2="195" stroke="#111111" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="430" y="130" width="200" height="130" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="530" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">3 Process</text>
  <text x="530" y="182" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">ISP / codecs / apps</text>
  <text x="530" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">compositor · GPU</text>
  <text x="530" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">shared budgets</text>
  <line x1="630" y1="195" x2="666" y2="195" stroke="#111111" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="668" y="130" width="180" height="130" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="758" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">4 Present</text>
  <text x="758" y="182" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">display frames</text>
  <text x="758" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">speakers / haptics</text>
  <text x="758" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">timed output</text>
  <line x1="848" y1="195" x2="884" y2="195" stroke="#111111" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="886" y="150" width="180" height="90" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="976" y="185" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">5 Human</text>
  <text x="976" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">perception</text>
  <text x="24" y="390" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Reading order 1→5. Pipelines may run in both directions (present while capturing). Conceptual only.</text>
