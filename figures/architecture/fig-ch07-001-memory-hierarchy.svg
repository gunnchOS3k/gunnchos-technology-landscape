<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="FIG-CH07-001-title FIG-CH07-001-desc" data-figure-id="FIG-CH07-001" data-truth-classification="conceptual">
  <title id="FIG-CH07-001-title">FIG-CH07-001: Memory hierarchy  registers, cache, RAM, storage</title>
  <desc id="FIG-CH07-001-desc">Conceptual pyramid. Reading order top to bottom: 1 Registers (tiny, fastest); 2 Cache (small, fast); 3 RAM main memory (working set, usually volatile); 4 Storage (large, durable). Qualitative only; RAM is not storage. Color is not the sole encoding.</desc>
  <rect width="720" height="500" fill="#ffffff"/>
  <rect x="1" y="1" width="718" height="498" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH07-001  Memory hierarchy</text>
  <text x="24" y="46" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: conceptual · Color is not the sole encoding</text>
  <text x="24" y="62" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence: architecture textbook hierarchy (qualitative). No invented timings.</text>
  <rect x="270" y="95" width="180" height="58" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="360" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">1 Registers</text>
  <text x="360" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">tiny · fastest</text>
  <rect x="230" y="168" width="260" height="58" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="360" y="191" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">2 Cache</text>
  <text x="360" y="211" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">small · fast · locality</text>
  <rect x="170" y="241" width="380" height="58" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="360" y="264" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">3 RAM (main memory)</text>
  <text x="360" y="284" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">working set · usually volatile</text>
  <rect x="110" y="314" width="500" height="58" fill="#ffffff" stroke="#111111" stroke-width="1.75" stroke-dasharray="6 3"/>
  <text x="360" y="337" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">4 Storage</text>
  <text x="360" y="357" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">large · durable home for files</text>
  <text x="40" y="410" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">RAM ` storage</text>
  <text x="40" y="432" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Closer to the CPU: smaller and faster. Storage: durable persistence. Dashed border marks durability layer.</text>
  <text x="24" y="475" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Registers → cache → RAM → storage. Conceptual educational hierarchy.</text>
</svg>
