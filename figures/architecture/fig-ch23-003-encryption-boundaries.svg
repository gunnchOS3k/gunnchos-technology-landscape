<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="FIG-CH23-003-title FIG-CH23-003-desc" data-figure-id="FIG-CH23-003" data-truth-classification="conceptual" data-inherits="FIG-CE5-004">
  <title id="FIG-CH23-003-title">FIG-CH23-003: Encryption transit, at-rest, and endpoint limits</title>
  <desc id="FIG-CH23-003-desc">Diagram of data encrypted in transit, encrypted at rest, then readable on an unlocked authenticated endpoint. A dashed note states encryption alone cannot guarantee correct UX, honest UI, safe endpoint, or human trust. Inherits CE-5 FIG-CE5-004. Truth: conceptual. Color is not the sole encoding.</desc>
  <rect width="960" height="380" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="378" fill="none" stroke="#222222" stroke-width="2"/>
  <defs>
    <marker id="arr23c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH23-003  Encryption goals and endpoint limits</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Truth: conceptual · Inherits CE-5 FIG-CE5-004 · Color is not the sole encoding</text>

  <rect x="40" y="120" width="220" height="80" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="150" y="154" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Transit</text>
  <text x="150" y="174" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">encrypted in motion</text>
  <line x1="260" y1="160" x2="320" y2="160" stroke="#111111" stroke-width="1.75" marker-end="url(#arr23c)"/>

  <rect x="320" y="120" width="220" height="80" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="430" y="154" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">At rest</text>
  <text x="430" y="174" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">encrypted storage</text>
  <line x1="540" y1="160" x2="600" y2="160" stroke="#111111" stroke-width="1.75" marker-end="url(#arr23c)"/>

  <rect x="600" y="120" width="280" height="80" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="740" y="154" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Unlocked endpoint</text>
  <text x="740" y="174" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">readable if authn+authz allow</text>

  <rect x="40" y="240" width="840" height="70" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="6 4"/>
  <text x="460" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Cannot alone guarantee: correct UX, honest UI, safe endpoint, or human trust</text>
  <text x="460" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">A padlock icon ` private forever · endpoint still matters</text>

  <text x="24" y="360" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Transit / at-rest encryption goals with honest endpoint limits. Conceptual; not a crypto course.</text>
</svg>
