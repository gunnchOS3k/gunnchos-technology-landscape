<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="FIG-CH12-001-title FIG-CH12-001-desc" data-figure-id="FIG-CH12-001" data-truth-classification="conceptual">
  <title id="FIG-CH12-001-title">FIG-CH12-001: Apps to processes, threads, scheduler, and CPU cores</title>
  <desc id="FIG-CH12-001-desc">Conceptual left-to-right system map. Reading order: 1 App icons and windows, 2 Processes with address-space isolation, 3 Threads inside a process, 4 OS scheduler, 5 CPU cores. The OS schedules and mediates; application instructions still execute on hardware. Truth classification: conceptual. Color is not the sole encoding.</desc>
  <rect width="1040" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="1038" height="418" fill="none" stroke="#222222" stroke-width="2"/>
  <defs>
    <marker id="arr12a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH12-001  Apps ’ processes/threads ’ scheduler ’ CPU cores</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Truth: conceptual  Representative educational architecture  Color is not the sole encoding</text>

  <rect x="28" y="120" width="150" height="120" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="103" y="155" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">1 Apps</text>
  <text x="103" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">icons / windows</text>
  <text x="103" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">felt experience</text>

  <line x1="178" y1="180" x2="208" y2="180" stroke="#111111" stroke-width="1.75" marker-end="url(#arr12a)"/>

  <rect x="208" y="120" width="170" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="293" y="155" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">2 Processes</text>
  <text x="293" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">isolated address</text>
  <text x="293" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">spaces</text>

  <line x1="378" y1="180" x2="408" y2="180" stroke="#111111" stroke-width="1.75" marker-end="url(#arr12a)"/>

  <rect x="408" y="120" width="170" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="493" y="155" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">3 Threads</text>
  <text x="493" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">shared memory</text>
  <text x="493" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">concurrent work</text>

  <line x1="578" y1="180" x2="608" y2="180" stroke="#111111" stroke-width="1.75" marker-end="url(#arr12a)"/>

  <rect x="608" y="120" width="170" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="693" y="155" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">4 Scheduler</text>
  <text x="693" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">who runs when</text>
  <text x="693" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">among runnable</text>

  <line x1="778" y1="180" x2="808" y2="180" stroke="#111111" stroke-width="1.75" marker-end="url(#arr12a)"/>

  <rect x="808" y="100" width="200" height="160" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="908" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">5 CPU cores</text>
  <rect x="830" y="155" width="60" height="40" fill="#f5f5f5" stroke="#111111" stroke-width="1.25"/>
  <text x="860" y="180" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">C0</text>
  <rect x="910" y="155" width="60" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="940" y="180" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">C1</text>
  <text x="908" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">execute instructions</text>

  <text x="24" y="320" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">OS schedules and mediates. Application logic still runs as instructions on processors under that mediation.</text>
  <text x="24" y="350" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">Stroke fill distinguishes process isolation (solid fill on Apps) from thread concurrency and core lanes (patterned cores).</text>
  <text x="24" y="390" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Conceptual educational map  not a measured Device Quartet EVT diagram.</text>
</svg>
