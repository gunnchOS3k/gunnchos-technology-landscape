<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="FIG-CH16-003-title FIG-CH16-003-desc" data-figure-id="FIG-CH16-003" data-truth-classification="conceptual">
  <title id="FIG-CH16-003-title">FIG-CH16-003: DNS on the critical path of a named request.</title>
  <desc id="FIG-CH16-003-desc">Two parallel stories: named request blocked at DNS while IP-literal or cached path may still work. Labels: Device, DNS dependency, LAN, Internet, Service. Conceptual; not a measured outage.</desc>
  <rect width="900" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="898" height="418" fill="none" stroke="#222222" stroke-width="2"/>
  <defs>
    <marker id="arrDns" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#111111" font-weight="bold">FIG-CH16-003  DNS on the critical path</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: conceptual · DNS ` connectivity ` service health</text>

  <text x="24" y="90" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Path A  named hostname (fails at name lookup)</text>
  <rect x="24" y="110" width="120" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="84" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">Device</text>
  <line x1="144" y1="135" x2="180" y2="135" stroke="#111111" stroke-width="1.5" marker-end="url(#arrDns)"/>
  <rect x="180" y="110" width="140" height="50" fill="#f5f5f5" stroke="#111111" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="250" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">DNS lookup</text>
  <text x="250" y="148" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">FAIL / timeout</text>
  <line x1="320" y1="135" x2="360" y2="135" stroke="#111111" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="420" y="140" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">LAN / Internet / Service never reached</text>

  <text x="24" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Path B  other work may still succeed</text>
  <rect x="24" y="230" width="120" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="84" y="260" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">Device</text>
  <line x1="144" y1="255" x2="180" y2="255" stroke="#111111" stroke-width="1.5" marker-end="url(#arrDns)"/>
  <rect x="180" y="230" width="100" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="230" y="260" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">LAN</text>
  <line x1="280" y1="255" x2="316" y2="255" stroke="#111111" stroke-width="1.5" marker-end="url(#arrDns)"/>
  <rect x="316" y="230" width="120" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="376" y="260" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">Internet</text>
  <line x1="436" y1="255" x2="472" y2="255" stroke="#111111" stroke-width="1.5" marker-end="url(#arrDns)"/>
  <rect x="472" y="230" width="140" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="542" y="260" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">Service OK</text>
  <text x="640" y="260" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">(cached name / IP / local service)</text>

  <text x="24" y="340" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">From the seat: Internet broken. Evidence may show only DNS failing for one name.</text>
  <text x="24" y="365" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">Keep distinct: DNS · routing · transport · remote service. Icons can stay green.</text>
  <text x="24" y="390" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">Teaching aid onlynot an outage postmortem or operator telemetry claim.</text>
</svg>
