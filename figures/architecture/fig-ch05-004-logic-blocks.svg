<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="340" viewBox="0 0 1040 340" role="img" aria-labelledby="title004 desc004">
  <title id="title004">FIG-CH05-004: Logic Building Blocks</title>
  <desc id="desc004">Inputs A and B feed an AND gate. Input C feeds a NOT gate. AND and NOT outputs feed an OR gate producing Output decision. Status: Conceptual educational diagram.</desc>
  <defs>
    <marker id="arr504" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect width="1040" height="340" fill="#ffffff"/>
  <rect x="1" y="1" width="1038" height="338" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="28" y="34" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#111111">FIG-CH05-004  Boolean blocks compose larger behavior</text>
  <text x="28" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#444444">Status: Conceptual · Labels identify gate types (not color alone)</text>

  <text x="80" y="120" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">A</text>
  <text x="80" y="170" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">B</text>
  <text x="80" y="250" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">C</text>

  <line x1="100" y1="116" x2="220" y2="130" stroke="#111111" stroke-width="2" marker-end="url(#arr504)"/>
  <line x1="100" y1="166" x2="220" y2="155" stroke="#111111" stroke-width="2" marker-end="url(#arr504)"/>
  <line x1="100" y1="246" x2="220" y2="246" stroke="#111111" stroke-width="2" marker-end="url(#arr504)"/>

  <rect x="220" y="110" width="120" height="70" rx="0" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="280" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">AND</text>

  <rect x="220" y="215" width="120" height="60" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="280" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">NOT</text>

  <line x1="340" y1="145" x2="480" y2="160" stroke="#111111" stroke-width="2" marker-end="url(#arr504)"/>
  <line x1="340" y1="245" x2="480" y2="200" stroke="#111111" stroke-width="2" marker-end="url(#arr504)"/>

  <rect x="480" y="150" width="140" height="70" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="550" y="192" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">OR</text>

  <line x1="620" y1="185" x2="740" y2="185" stroke="#111111" stroke-width="2" marker-end="url(#arr504)"/>

  <rect x="740" y="150" width="220" height="70" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="850" y="180" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Output decision</text>
  <text x="850" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">(A AND B) OR (NOT C)</text>

  <text x="28" y="310" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Reading order: inputs A/B/C  AND / NOT  OR  output. Example Boolean composition only.</text>
</svg>
