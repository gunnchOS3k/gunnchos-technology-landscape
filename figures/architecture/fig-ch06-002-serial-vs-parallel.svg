<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="FIG-CH06-002-title FIG-CH06-002-desc" data-figure-id="FIG-CH06-002" data-truth-classification="illustrative">
  <title id="FIG-CH06-002-title">FIG-CH06-002: Single-thread work versus parallelizable work</title>
  <desc id="FIG-CH06-002-desc">Illustrative timeline comparison. Top lane: one long serial bar labeled sequential dependency. Bottom lane: three shorter bars labeled independent chunks that can overlap across cores. More cores help only when useful parallel work exists. Truth classification: illustrative teaching model, not measured speedups. Color is not the sole encoding.</desc>
  <rect width="1000" height="440" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="438" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH06-002  Single-thread vs parallelizable work</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Truth: illustrative · Not measured IPC/GHz/speedup claims · Color is not the sole encoding</text>

  <text x="24" y="90" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">A. Mostly serial dependency</text>
  <text x="40" y="120" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">time →</text>
  <rect x="100" y="100" width="760" height="40" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="480" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">one long dependent chain (extra cores wait)</text>

  <text x="24" y="200" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">B. Useful independent chunks</text>
  <text x="40" y="230" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">time →</text>
  <rect x="100" y="210" width="220" height="36" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="210" y="233" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">chunk 1 · core A</text>
  <rect x="100" y="256" width="220" height="36" fill="#ffffff" stroke="#111111" stroke-width="1.75" stroke-dasharray="5 3"/>
  <text x="210" y="279" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">chunk 2 · core B</text>
  <rect x="100" y="302" width="220" height="36" fill="#ffffff" stroke="#111111" stroke-width="1.75" stroke-dasharray="2 2"/>
  <text x="210" y="325" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">chunk 3 · core C</text>
  <rect x="340" y="256" width="160" height="36" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="420" y="279" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">join / finish</text>

  <text x="24" y="380" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Extra cores help lane B more than lane A. Real apps mix both patterns; contention and waiting still matter.</text>
  <text x="24" y="410" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Illustrative teaching timelines  bar lengths are pedagogical, not lab measurements.</text>
</svg>
