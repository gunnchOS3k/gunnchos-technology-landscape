<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-labelledby="FIG-CH12-004-title FIG-CH12-004-desc" data-figure-id="FIG-CH12-004" data-truth-classification="measured">
  <title id="FIG-CH12-004-title">FIG-CH12-004: Classroom OS-monitor before and during snapshots</title>
  <desc id="FIG-CH12-004-desc">Measured teaching figure derived from LAB-CMS-001 fixture FIG-CE3-009. Left panel Before: CPU 8 percent, memory 6.2 of 16 GB, disk idle. Right panel During: CPU 41 percent, memory 6.9 of 16 GB, brief disk spike, qualitative brief stutter. Classroom n equals 1 teaching fixture, not a product SLO or Device Quartet EVT. Color is not the sole encoding.</desc>
  <rect width="1040" height="460" fill="#ffffff"/>
  <rect x="1" y="1" width="1038" height="458" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH12-004  OS-monitor before / during (LAB-CMS-001 fixture)</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Truth: measured teaching fixture (FIG-CE3-009)  classroom n=1  not a product SLO  Color is not the sole encoding</text>

  <rect x="40" y="80" width="460" height="280" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="270" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Before (idle baseline)</text>
  <text x="270" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">timestamp 2026-09-03T15:00:00Z</text>
  <text x="70" y="175" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#111111">CPU (overall): 8%</text>
  <text x="70" y="205" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#111111">Memory used: 6.2 GB of 16 GB</text>
  <text x="70" y="235" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#111111">Disk activity: idle / near 0%</text>
  <text x="70" y="265" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#111111">Top process (redacted): NotesApp ~3%</text>
  <rect x="70" y="290" width="400" height="44" fill="#f5f5f5" stroke="#111111" stroke-width="1.25"/>
  <text x="270" y="317" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Observation only  no root cause yet</text>

  <rect x="540" y="80" width="460" height="280" fill="#ffffff" stroke="#111111" stroke-width="1.75" stroke-dasharray="6 4"/>
  <text x="770" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">During (controlled action)</text>
  <text x="770" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">timestamp 2026-09-03T15:00:25Z</text>
  <text x="570" y="175" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#111111">CPU (overall): 41%</text>
  <text x="570" y="205" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#111111">Memory used: 6.9 GB of 16 GB</text>
  <text x="570" y="235" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#111111">Disk activity: brief spike, then settle</text>
  <text x="570" y="265" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#111111">Feel: brief stutter, then smooth</text>
  <rect x="570" y="290" width="400" height="44" fill="#f5f5f5" stroke="#111111" stroke-width="1.25"/>
  <text x="770" y="317" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Inference must stay labeled</text>

  <text x="24" y="400" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Numbers reproduce LAB-CMS-001 fixture FIG-CE3-009 for teaching. Your personal device may differ; collect your own before/during rows.</text>
  <text x="24" y="430" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Classroom n=1 fixture snapshot  not Device Quartet EVT, not Gate 3 reader evidence, not a universal SLO.</text>
