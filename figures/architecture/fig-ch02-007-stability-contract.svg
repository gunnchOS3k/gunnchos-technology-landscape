<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Stability Contract: central Human experience succeeds node connected to eight concurrent condition chips." data-figure-id="FIG-CH02-007">
  <title>FIG-CH02-007: Stability Contract</title>
  <desc>Central node labeled Human experience succeeds surrounded by eight condition chips connected by lines: Touch recognized, Event delivered, App scheduled, Handler completes, Memory available, Network/service if needed, Frame reaches display, Delay acceptable. Layout shows concurrency — multiple conditions must hold together simultaneously, not a numbered checklist alone. Network/service chip uses dashed stroke as optional when remote work is needed.</desc>

  <rect width="1000" height="620" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="618" fill="none" stroke="#222222" stroke-width="2"/>

  <text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#111111">FIG-CH02-007 — Stability Contract</text>
  <text x="24" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#444444">Status: Conceptual educational diagram · Concurrent conditions, not a serial checklist</text>

  <!-- Connector lines from chips to center (drawn first) -->
  <g stroke="#888888" stroke-width="1.5">
    <line x1="200" y1="160" x2="420" y2="280"/>
    <line x1="500" y1="140" x2="500" y2="240"/>
    <line x1="800" y1="160" x2="580" y2="280"/>
    <line x1="180" y1="310" x2="380" y2="310"/>
    <line x1="820" y1="310" x2="620" y2="310"/>
    <line x1="200" y1="460" x2="420" y2="340"/>
    <line x1="500" y1="480" x2="500" y2="380"/>
    <line x1="800" y1="460" x2="580" y2="340"/>
  </g>

  <!-- Central node -->
  <ellipse cx="500" cy="310" rx="140" ry="70" fill="#f5f5f5" stroke="#111111" stroke-width="2.5"/>
  <text x="500" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Human experience</text>
  <text x="500" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">succeeds</text>
  <text x="500" y="342" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1F4B7A">ALL conditions must hold</text>

  <!-- Condition chips (rounded rects) -->
  <!-- Top-left: Touch recognized -->
  <rect x="80" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="160" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Touch recognized</text>
  <text x="160" y="156" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">digitizer + firmware</text>

  <!-- Top: Event delivered -->
  <rect x="420" y="90" width="160" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="500" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Event delivered</text>
  <text x="500" y="126" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">OS → application</text>

  <!-- Top-right: App scheduled -->
  <rect x="760" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="840" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">App scheduled</text>
  <text x="840" y="156" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">CPU time available</text>

  <!-- Mid-left: Handler completes -->
  <rect x="40" y="286" width="160" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="120" y="306" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Handler completes</text>
  <text x="120" y="322" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">no hang / crash</text>

  <!-- Mid-right: Memory available -->
  <rect x="800" y="286" width="160" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="880" y="306" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Memory available</text>
  <text x="880" y="322" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">working set fits</text>

  <!-- Bottom-left: Network/service if needed (dashed = optional) -->
  <rect x="80" y="450" width="180" height="48" rx="6" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="5 3"/>
  <text x="170" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1F4B7A">Network/service</text>
  <text x="170" y="486" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">if needed · optional</text>

  <!-- Bottom: Frame reaches display -->
  <rect x="420" y="480" width="160" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="500" y="500" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Frame reaches display</text>
  <text x="500" y="516" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">compose + scanout</text>

  <!-- Bottom-right: Delay acceptable -->
  <rect x="740" y="450" width="180" height="48" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="830" y="470" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Delay acceptable</text>
  <text x="830" y="486" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">to the person</text>

  <!-- Concurrency callout -->
  <rect x="300" y="560" width="400" height="36" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
  <text x="500" y="582" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Concurrency: conditions hold together · any one failure can break the experience</text>
</svg>
