<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-labelledby="FIG-CH12-002-title FIG-CH12-002-desc" data-figure-id="FIG-CH12-002" data-truth-classification="conceptual">
  <title id="FIG-CH12-002-title">FIG-CH12-002: Context-switch swimlane</title>
  <desc id="FIG-CH12-002-desc">Conceptual sequence swimlane. Top lane Thread A runs then yields. Middle lane OS saves Thread A state, selects Thread B, restores Thread B state. Bottom lane Thread B runs. Arrows show time moving left to right. Truth classification: conceptual teaching model, not a traced kernel log. Color is not the sole encoding.</desc>
  <rect width="1040" height="460" fill="#ffffff"/>
  <rect x="1" y="1" width="1038" height="458" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH12-002  Context-switch swimlane</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Truth: conceptual  Teaching sequence, not a measured ftrace capture  Color is not the sole encoding</text>

  <text x="40" y="90" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Thread A</text>
  <rect x="160" y="70" width="280" height="40" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="300" y="95" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">1 Running (CPU state live)</text>
  <rect x="520" y="70" width="120" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="580" y="95" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">waiting</text>
  <rect x="720" y="70" width="200" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="820" y="95" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">later runnable again</text>

  <text x="40" y="180" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">OS / kernel</text>
  <rect x="440" y="150" width="200" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="540" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">2 Context switch</text>
  <text x="540" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">save A · pick B · restore B</text>

  <text x="40" y="290" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Thread B</text>
  <rect x="160" y="270" width="120" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="220" y="295" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">runnable</text>
  <rect x="640" y="270" width="280" height="40" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="780" y="295" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">3 Running on a core</text>

  <line x1="440" y1="110" x2="500" y2="150" stroke="#111111" stroke-width="1.5"/>
  <line x1="640" y1="185" x2="700" y2="270" stroke="#111111" stroke-width="1.5"/>

  <text x="24" y="360" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">A context switch saves and restores CPU state so another runnable entity can use the processor.</text>
  <text x="24" y="388" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">Solid filled bars = currently running. Dashed empty bars = not on CPU. Labels carry meaning without color alone.</text>
  <text x="24" y="430" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Conceptual swimlane  platforms differ; this is orientation, not vendor algorithm loyalty.</text>
</svg>
