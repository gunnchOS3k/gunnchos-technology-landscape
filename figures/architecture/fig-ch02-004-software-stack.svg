<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="Software stack layers Application through Hardware with upward event arrows and downward output arrows." data-figure-id="FIG-CH02-004">
  <title>FIG-CH02-004: Software Stack</title>
  <desc>Vertical stack of layered rectangles from top to bottom: Application, Runtime, Libraries, Kernel, Drivers, Firmware, Hardware. Solid arrows on the left point upward labeled events rising. Solid arrows on the right point downward labeled output descending. Accent used sparingly on directional labels only.</desc>
  <defs>
    <marker id="arr004u" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#1F4B7A"/>
    </marker>
    <marker id="arr004d" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>
  <rect x="1" y="1" width="898" height="618" fill="none" stroke="#222222" stroke-width="2"/>

  <text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#111111">FIG-CH02-004 — Software Stack</text>
  <text x="24" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#444444">Status: Conceptual educational diagram · Real systems vary in naming and boundaries</text>

  <!-- Stack layers: x=220, width=400 -->
  <!-- Application -->
  <rect x="220" y="80" width="400" height="52" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="420" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Application</text>
  <text x="420" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">UI · handlers · local state</text>

  <!-- Runtime -->
  <rect x="220" y="138" width="400" height="52" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="420" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Runtime / framework</text>
  <text x="420" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">scheduling · language runtime</text>

  <!-- Libraries -->
  <rect x="220" y="196" width="400" height="52" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="420" y="218" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Libraries / system services</text>
  <text x="420" y="236" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">IPC · graphics · networking APIs</text>

  <!-- Kernel -->
  <rect x="220" y="254" width="400" height="52" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="420" y="276" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Kernel</text>
  <text x="420" y="294" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">process · memory · I/O multiplex</text>

  <!-- Drivers -->
  <rect x="220" y="312" width="400" height="52" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="420" y="334" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Drivers</text>
  <text x="420" y="352" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">input · display · storage · radio</text>

  <!-- Firmware -->
  <rect x="220" y="370" width="400" height="52" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="420" y="392" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Firmware</text>
  <text x="420" y="410" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">controller microcode · boot</text>

  <!-- Hardware -->
  <rect x="220" y="428" width="400" height="52" fill="#e8e8e8" stroke="#111111" stroke-width="2"/>
  <text x="420" y="450" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Hardware</text>
  <text x="420" y="468" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">SoC · sensors · display panel · radio</text>

  <!-- Left: events rising (up arrows) -->
  <line x1="160" y1="450" x2="160" y2="110" stroke="#1F4B7A" stroke-width="2.5" marker-end="url(#arr004u)"/>
  <text x="100" y="280" text-anchor="middle" transform="rotate(-90 100 280)" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1F4B7A">events ↑</text>
  <text x="128" y="520" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">tap rises</text>

  <!-- Right: output descending (down arrows) -->
  <line x1="680" y1="110" x2="680" y2="450" stroke="#111111" stroke-width="2.5" marker-end="url(#arr004d)"/>
  <text x="740" y="280" text-anchor="middle" transform="rotate(90 740 280)" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">output ↓</text>
  <text x="720" y="520" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">frame descends</text>

  <!-- Small side annotations -->
  <text x="24" y="560" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666666">Upward path: input event delivery toward Application</text>
  <text x="24" y="580" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666666">Downward path: rendered output toward display Hardware</text>
  <text x="24" y="604" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666666">Alternating fill + layer names encode position (color is not sole encoding)</text>
</svg>
