<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="FIG-CH07-003-title FIG-CH07-003-desc" data-figure-id="FIG-CH07-003" data-truth-classification="illustrative">
  <title id="FIG-CH07-003-title">FIG-CH07-003: Healthy network icon with memory-pressure hitch</title>
  <desc id="FIG-CH07-003-desc">Illustrative two-panel diagram. Left: connectivity icon shows connected. Right: memory pressure symptomsstutter, reclaim, paging/I/O waitwhile the icon still looks fine. Reading order: panel A network status; panel B local memory/storage pressure. Truth: illustrative teaching aid, not a measured field study.</desc>
  <rect width="860" height="380" fill="#ffffff"/>
  <rect x="1" y="1" width="858" height="378" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH07-003  Healthy network icon ` healthy memory</text>
  <text x="24" y="46" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: illustrative · Color is not the sole encoding</text>
  <rect x="40" y="80" width="360" height="220" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="220" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">A. Connectivity (looks fine)</text>
  <circle cx="160" cy="180" r="28" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="160" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#111111">WiFi</text>
  <text x="220" y="175" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Status: Connected</text>
  <text x="220" y="198" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">Icon ` proof of local health</text>
  <text x="60" y="260" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Do not stop diagnosis at the icon.</text>
  <rect x="460" y="80" width="360" height="220" fill="#ffffff" stroke="#111111" stroke-width="1.75" stroke-dasharray="6 3"/>
  <text x="640" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">B. Local pressure (possible hitch)</text>
  <text x="480" y="150" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">1. Working set grows</text>
  <text x="480" y="175" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">2. RAM reclaim / paging</text>
  <text x="480" y="200" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">3. Extra storage I/O wait</text>
  <text x="480" y="225" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">4. UI stutter / hang feel</text>
  <text x="480" y="260" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">Dashed panel = local domain</text>
  <text x="40" y="330" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">ILLUSTRATIVE: same human lag can come from memory or storage pressure while the network icon still looks polite.</text>
  <text x="24" y="360" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Illustrative contrast for LAB-CMS-001 diagnosis practice. Not fleet telemetry.</text>
</svg>
