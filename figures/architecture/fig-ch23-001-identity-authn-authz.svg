<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="FIG-CH23-001-title FIG-CH23-001-desc" data-figure-id="FIG-CH23-001" data-truth-classification="conceptual" data-inherits="FIG-CE5-003">
  <title id="FIG-CH23-001-title">FIG-CH23-001: Identity, authentication, and authorization decision ladder</title>
  <desc id="FIG-CH23-001-desc">Three-step ladder labeled Identity, Authentication, and Authorization leading to Allow or Deny. Reading order: Identity (who you claim); Authentication (proof of claim); Authorization (allowed actions); Allow; Deny. Conceptual educational diagram inherited from CE-5 FIG-CE5-003. Color is not the sole encoding.</desc>
  <rect width="900" height="360" fill="#ffffff"/>
  <rect x="1" y="1" width="898" height="358" fill="none" stroke="#222222" stroke-width="2"/>
  <defs>
    <marker id="arr23a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH23-001  Identity  authentication  authorization</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Truth: conceptual · Inherits CE-5 FIG-CE5-003 · Color is not the sole encoding</text>
  <text x="24" y="66" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">AuthN ` AuthZ  login success does not prove every action is allowed</text>

  <rect x="40" y="140" width="180" height="70" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="130" y="169" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">1 Identity</text>
  <text x="130" y="189" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">who/what you claim</text>
  <line x1="220" y1="175" x2="260" y2="175" stroke="#111111" stroke-width="1.75" marker-end="url(#arr23a)"/>

  <rect x="260" y="140" width="180" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="350" y="169" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">2 Authentication</text>
  <text x="350" y="189" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">proof for the risk</text>
  <line x1="440" y1="175" x2="480" y2="175" stroke="#111111" stroke-width="1.75" marker-end="url(#arr23a)"/>

  <rect x="480" y="140" width="180" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="570" y="169" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">3 Authorization</text>
  <text x="570" y="189" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">what you may do</text>
  <line x1="700" y1="175" x2="760" y2="175" stroke="#111111" stroke-width="1.75" marker-end="url(#arr23a)"/>

  <rect x="760" y="120" width="100" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="810" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">ALLOW</text>
  <rect x="760" y="190" width="100" height="50" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="6 4"/>
  <text x="810" y="215" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">DENY</text>

  <text x="24" y="340" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Identity claim  authentication assurance  authorization decision. Conceptual; not a product auth flow capture.</text>
</svg>
