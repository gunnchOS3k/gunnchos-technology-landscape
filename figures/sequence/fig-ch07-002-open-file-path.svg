<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="FIG-CH07-002-title FIG-CH07-002-desc" data-figure-id="FIG-CH07-002" data-truth-classification="conceptual">
  <title id="FIG-CH07-002-title">FIG-CH07-002: Open file path  storage to RAM to cache to CPU</title>
  <desc id="FIG-CH07-002-desc">Conceptual left-to-right flow. Reading order: 1 Storage (durable file); 2 RAM (working copy); 3 Cache (nearby copy); 4 CPU (uses data); 5 UI progress. Misses at a layer cost time. Truth: conceptual.</desc>
  <rect width="900" height="320" fill="#ffffff"/>
  <rect x="1" y="1" width="898" height="318" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH07-002  Opening a file: storage ’ RAM ’ cache ’ CPU</text>
  <text x="24" y="46" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: conceptual · Color is not the sole encoding</text>
  <rect x="40" y="100" width="140" height="90" fill="#ffffff" stroke="#111111" stroke-width="1.75" stroke-dasharray="6 3"/>
  <text x="110" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">1 Storage</text>
  <text x="110" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">durable file</text>
  <path d="M185 145 L225 145" stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="230" y="100" width="140" height="90" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="300" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">2 RAM</text>
  <text x="300" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">working copy</text>
  <path d="M375 145 L415 145" stroke="#111111" stroke-width="2" fill="none"/>
  <rect x="420" y="100" width="140" height="90" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="490" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">3 Cache</text>
  <text x="490" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">nearby copy</text>
  <path d="M565 145 L605 145" stroke="#111111" stroke-width="2" fill="none"/>
  <rect x="610" y="100" width="120" height="90" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="670" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">4 CPU</text>
  <text x="670" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">uses data</text>
  <path d="M735 145 L775 145" stroke="#111111" stroke-width="2" fill="none"/>
  <rect x="780" y="100" width="90" height="90" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="825" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">5 UI</text>
  <text x="825" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">progress</text>
  <text x="40" y="230" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Hit: data already nearby ’ less wait. Miss: fetch from a farther layer ’ more wait.</text>
  <text x="40" y="252" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">First open often pays storage’RAM cost; later edits may ride cache/RAM until a durable save.</text>
  <text x="24" y="295" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Conceptual open-file path. Not a measured device timeline.</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#111111"/>
    </marker>
  </defs>
</svg>
