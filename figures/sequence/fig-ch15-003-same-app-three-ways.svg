<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="FIG-CH15-003-title FIG-CH15-003-desc" data-figure-id="FIG-CH15-003" data-truth-classification="illustrative">
  <title id="FIG-CH15-003-title">FIG-CH15-003: Same app as local install, container, or cloud URL</title>
  <desc id="FIG-CH15-003-desc">Illustrative three-path diagram. Common start: Human task. Path A: Local install on device. Path B: Container image on host. Path C: Browser client to cloud URL placement. Same task, different packaging and placement. Truth classification: illustrative. Color is not the sole encoding.</desc>
  <rect width="1100" height="400" fill="#ffffff"/>
  <rect x="1" y="1" width="1098" height="398" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#111111">FIG-CH15-003  Same task, three presentations</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Truth: illustrative · Not a product endorsement · Color is not the sole encoding</text>

  <rect x="400" y="70" width="300" height="50" fill="#f5f5f5" stroke="#111111" stroke-width="1.75"/>
  <text x="550" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">Human task (one intent)</text>

  <line x1="450" y1="120" x2="200" y2="170" stroke="#111111" stroke-width="1.5"/>
  <line x1="550" y1="120" x2="550" y2="170" stroke="#111111" stroke-width="1.5"/>
  <line x1="650" y1="120" x2="900" y2="170" stroke="#111111" stroke-width="1.5"/>

  <rect x="60" y="170" width="280" height="140" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="200" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">A. Local install</text>
  <text x="200" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">app on this device</text>
  <text x="200" y="255" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">placement: local</text>
  <text x="200" y="280" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">access: may be offline</text>

  <rect x="410" y="170" width="280" height="140" fill="#ffffff" stroke="#111111" stroke-width="1.75" stroke-dasharray="6 4"/>
  <text x="550" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">B. Container / image</text>
  <text x="550" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">packaged on a host</text>
  <text x="550" y="255" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">isolation: shared-kernel typical</text>
  <text x="550" y="280" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">may still call remote APIs</text>

  <rect x="760" y="170" width="280" height="140" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.75"/>
  <text x="900" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">C. Cloud URL</text>
  <text x="900" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">browser client + remote service</text>
  <text x="900" y="255" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">placement: cloud (hypothesis)</text>
  <text x="900" y="280" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">access: Wi-Fi or cellular</text>

  <text x="24" y="350" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Dashed border = container packaging path. Solid blue-tinted stroke = remote URL path. Cloud here is a placement hypothesis unless evidenced.</text>
  <text x="24" y="375" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Illustrative teaching parallel  not vendor performance data.</text>
</svg>
