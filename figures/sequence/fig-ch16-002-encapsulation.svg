<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="FIG-CH16-002-title FIG-CH16-002-desc" data-figure-id="FIG-CH16-002" data-truth-classification="conceptual">
  <title id="FIG-CH16-002-title">FIG-CH16-002: Encapsulation as sticky-note headers along one path.</title>
  <desc id="FIG-CH16-002-desc">Numbered swimlane: App to OS stack to NIC/radio to Gateway to Path to Service. Headers add going out and remove coming back. Conceptual; no measured timings.</desc>
  <rect width="1040" height="400" fill="#ffffff"/>
  <rect x="1" y="1" width="1038" height="398" fill="none" stroke="#222222" stroke-width="2"/>
  <defs>
    <marker id="arr16" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#111111" font-weight="bold">FIG-CH16-002  Encapsulation sticky notes (one connected action)</text>
  <text x="24" y="48" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: conceptual · inherit FIG-CE4-002 · no measured timings</text>
  <rect x="30" y="150" width="140" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="100" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">1 App</text>
  <line x1="170" y1="185" x2="200" y2="185" stroke="#111111" stroke-width="1.75" marker-end="url(#arr16)"/>
  <rect x="200" y="150" width="140" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="270" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">2 OS stack</text>
  <line x1="340" y1="185" x2="370" y2="185" stroke="#111111" stroke-width="1.75" marker-end="url(#arr16)"/>
  <rect x="370" y="150" width="140" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="440" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">3 NIC/radio</text>
  <line x1="510" y1="185" x2="540" y2="185" stroke="#111111" stroke-width="1.75" marker-end="url(#arr16)"/>
  <rect x="540" y="150" width="140" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="610" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">4 Gateway</text>
  <line x1="680" y1="185" x2="710" y2="185" stroke="#111111" stroke-width="1.75" marker-end="url(#arr16)"/>
  <rect x="710" y="150" width="140" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="780" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">5 Path</text>
  <line x1="850" y1="185" x2="880" y2="185" stroke="#111111" stroke-width="1.75" marker-end="url(#arr16)"/>
  <rect x="880" y="150" width="140" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75"/>
  <text x="950" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">6 Service</text>
  <text x="24" y="280" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Packets = bounded chunks with headersnot an unbroken hose of bits.</text>
  <text x="24" y="310" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">Keep distinct: device path steps (13) · LAN hop (4) · Internet path (5) · remote service (6).</text>
  <text x="24" y="340" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">DNS is a separate dependency before many named Internet pathsnot drawn as the network itself.</text>
</svg>
