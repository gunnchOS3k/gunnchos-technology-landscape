  <title id="FIG-CE1-002-title">FIG-CE1-002: Teach inputs → processing → state → outputs for the chrome-before-content moment.</title>
  <desc id="FIG-CE1-002-desc">Numbered step list in reading order; announce that steps may overlap in real systems. Reading order: 1 Inputs; 2 Processing; 3 State; 4 Outputs; Human judgment feedback.</desc>
  <rect width="1000" height="320" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="318" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="30" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">FIG-CE1-002 — Teach inputs → processing → state → outputs for the chrome-before-cont</text>
  <text x="24" y="50" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: conceptual · Color is not the sole encoding</text>
  <text x="24" y="68" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence: Pedagogical; aligned to WHATWG event/state language at high level without claiming one implementation.</text>
