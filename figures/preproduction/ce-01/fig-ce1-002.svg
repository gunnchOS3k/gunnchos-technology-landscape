  <text x="24" y="304" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption draft: Teach inputs → processing → state → outputs for the chrome-before-content moment.. State update can happen before content is usable; processing may continue aft</text>
