  <title id="FIG-CE1-005-title">FIG-CE1-005: Map everyday symptoms to failure-domain buckets without claiming root cause.</title>
  <desc id="FIG-CE1-005-desc">Table semantics preferred; if graphic, provide equivalent table. Reading order: Symptom; Failure domain; Evidence still needed. Map everyday symptoms to failure-domain buckets without claiming root cause. Healthy connectivity icon can still sit beside an unusable experience. Truth: illustrative. Color is not the sole encoding.</desc>
