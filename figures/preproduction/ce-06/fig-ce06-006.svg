  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#111111" font-weight="bold">FIG-CE06-006 — Map logs, metrics, and traces (conceptually) onto Stability</text><text x="24" y="46" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: see metadata · Color is not the sole encoding</text><text x="24" y="62" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence: OpenTelemetry Signals concepts (analogy)</text><text x="24" y="380" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Map logs, metrics, and traces (conceptually) onto Stability Contract conditions.</text><rect x="40" y="100" width="280" height="200" fill="#fafafa" stroke="#111111" stroke-width="1.75" />
<text x="180.0" y="194.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Logs</text>
<text x="180.0" y="214.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">illuminates some conditions</text>
<rect x="340" y="100" width="280" height="200" fill="#fafafa" stroke="#111111" stroke-width="1.75" />
