<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="FIG-CE06-006-title FIG-CE06-006-desc" data-figure-id="FIG-CE06-006" data-truth-classification="conceptual" data-template="tmpl-ecosystem-system-map" data-qualification="">
  <title id="FIG-CE06-006-title">FIG-CE06-006: Map logs, metrics, and traces (conceptually) onto Stability Contract conditions.</title>
  <desc id="FIG-CE06-006-desc">Explain each signal type and which conditions it can support. Reading order: Logs; Metrics; Traces; Condition chips. Map logs, metrics, and traces (conceptually) onto Stability Contract conditions. Different signals illuminate different conditions; no single signal is omniscient. Truth: conceptual. Color is not the sole encoding.</desc>
