<text x="480.0" y="214.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">illuminates some conditions</text>
<rect x="640" y="100" width="280" height="200" fill="#fafafa" stroke="#111111" stroke-width="1.75" />
<text x="780.0" y="194.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Traces</text>
<text x="780.0" y="214.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">illuminates some conditions</text>
