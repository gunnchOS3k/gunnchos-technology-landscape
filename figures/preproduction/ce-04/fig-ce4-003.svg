<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="FIG-CE4-003-title FIG-CE4-003-desc" data-figure-id="FIG-CE4-003" data-truth-classification="conceptual" data-template="tmpl-ecosystem-system-map" data-qualification="">
  <title id="FIG-CE4-003-title">FIG-CE4-003: Separate Wi-Fi access, cellular access, and Internet backbone as different boxes.</title>
  <desc id="FIG-CE4-003-desc">Explicit statement that branches are alternatives/complements, not identical Reading order: User device; Wi-Fi AP; Cellular RAN/core; Internet path; Edge; Cloud. Separate Wi-Fi access, cellular access, and Internet backbone as different boxes. Wi-Fi and cellular are on-ramps; cloud is placement of service, not an access radio. Truth: conceptual. Color is not the sole encoding.</desc>
  <rect width="1000" height="440" fill="#ffffff" />
  <rect x="1" y="1" width="998" height="438" fill="none" stroke="#222222" stroke-width="2" />
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111" />
    </marker>
  </defs>

<text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#111111" font-weight="bold">FIG-CE4-003 — Separate Wi-Fi access, cellular access, and Internet backbone</text><text x="24" y="46" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: see metadata · Color is not the sole encoding</text><text x="24" y="62" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence: IEEE 802.11 family (Wi-Fi LAN); 3GPP TS 23.501 family (5G system architecture survey);</text><text x="24" y="76" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">NIST cloud definition</text><text x="24" y="420" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Separate Wi-Fi access, cellular access, and Internet backbone as different boxes.</text><rect x="40" y="180" width="140" height="70" fill="#f5f5f5" stroke="#111111" stroke-width="1.75" />
