  <title id="FIG-CE4-002-title">FIG-CE4-002: Follow one sync request as encapsulation and hops (sticky-note headers).</title>
  <desc id="FIG-CE4-002-desc">Numbered step list equivalent to the sequence Reading order: App; OS stack; NIC/radio; Gateway; Path; Edge/Cloud. Follow one sync request as encapsulation and hops (sticky-note headers). Order of header add/remove; gateway as a hop; remote service as endpoint. Truth: conceptual. Color is not the sole encoding.</desc>
