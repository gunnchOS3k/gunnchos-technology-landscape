  <title id="FIG-CE3-005-title">FIG-CE3-005: CPU vs accelerator/GPU role cards</title>
  <desc id="FIG-CE3-005-desc">FIG-CE3-005: CPU vs accelerator/GPU role cards. Educational diagram. Reading order: CPU card; Accelerator/GPU card. CPU vs accelerator/GPU role cards. Who orchestrates vs who executes specialized work', 'Shared resource limits (memory bandwidth, power) Truth: conceptual. Color is not the sole encoding.</desc>
  <rect width="900" height="400" fill="#ffffff" />
  <rect x="1" y="1" width="898" height="398" fill="none" stroke="#222222" stroke-width="2" />
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#111111" font-weight="bold">FIG-CE3-005 — CPU vs accelerator/GPU role cards</text><text x="24" y="46" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: see metadata · Color is not the sole encoding</text><text x="24" y="62" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence: patterson-hennessy-riscv; khronos-vulkan-overview (pointer)</text><text x="24" y="380" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: CPU vs accelerator/GPU role cards.</text><rect x="60" y="100" width="360" height="220" fill="#fafafa" stroke="#111111" stroke-width="1.75" />
<text x="240.0" y="210.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">CPU</text>
<text x="90" y="180" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Orchestrates general work</text>
<text x="90" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Runs app threads</text>
<text x="90" y="240" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Shared limits: mem/power</text>
<rect x="480" y="100" width="360" height="220" fill="#fafafa" stroke="#111111" stroke-width="1.75" />
<text x="660.0" y="210.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Accelerator / GPU</text>
<text x="510" y="180" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Specialized parallel work</text>
<text x="510" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Not 'OS is the GPU'</text>
<text x="510" y="240" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Shared bandwidth/power</text>
  </svg>
