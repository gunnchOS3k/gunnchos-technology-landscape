  <title id="FIG-CE3-002-title">FIG-CE3-002: Memory hierarchy: registers → cache → RAM → storage</title>
  <desc id="FIG-CE3-002-desc">FIG-CE3-002: Memory hierarchy: registers → cache → RAM → storage. Educational diagram. Reading order: Registers; Cache; RAM; Storage. Memory hierarchy: registers → cache → RAM → storage. RAM ≠ storage', 'Closer to CPU is smaller/faster; storage is durable home for files Truth: conceptual. Color is not the sole encoding.</desc>
  <rect width="720" height="480" fill="#ffffff" />
  <rect x="1" y="1" width="718" height="478" fill="none" stroke="#222222" stroke-width="2" />
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#111111" font-weight="bold">FIG-CE3-002 — Memory hierarchy: registers → cache → RAM → storage</text><text x="24" y="46" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: see metadata · Color is not the sole encoding</text><text x="24" y="62" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence: patterson-hennessy-riscv (qualitative hierarchy)</text><text x="24" y="460" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Memory hierarchy: registers → cache → RAM → storage.</text><rect x="270.0" y="100" width="180" height="55" fill="#f5f5f5" stroke="#111111" stroke-width="1.75" />
<text x="360.0" y="121.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">1 Registers</text>
<text x="360.0" y="141.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">tiny / fastest</text>
<rect x="230.0" y="170" width="260" height="55" fill="#f5f5f5" stroke="#111111" stroke-width="1.75" />
<text x="360.0" y="191.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">2 Cache</text>
<text x="360.0" y="211.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">small / fast</text>
<rect x="180.0" y="240" width="360" height="55" fill="#f5f5f5" stroke="#111111" stroke-width="1.75" />
<text x="360.0" y="261.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">3 RAM</text>
<text x="360.0" y="281.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">working set / volatile</text>
<rect x="120.0" y="310" width="480" height="55" fill="#f5f5f5" stroke="#111111" stroke-width="1.75" />
<text x="360.0" y="331.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">4 Storage</text>
<text x="360.0" y="351.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">large / durable</text>
<text x="40" y="420" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Qualitative hierarchy only — no invented nanosecond or capacity tables. RAM ≠ storage.</text>
