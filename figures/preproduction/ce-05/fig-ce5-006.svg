  <title id="FIG-CE5-006-title">FIG-CE5-006: Contrast felt reliability with controls and evidence.</title>
  <desc id="FIG-CE5-006-desc">Two-column ledger comparing feelings of trust with technical controls and evidence artifacts. Reading order: Human trust feelings; Technical controls; Evidence artifacts. Contrast felt reliability with controls and evidence. Human trust vs technical trust dual ledger Truth: illustrative. Color is not the sole encoding.</desc>
  <rect width="960" height="400" fill="#ffffff" />
  <rect x="1" y="1" width="958" height="398" fill="none" stroke="#222222" stroke-width="2" />
  <text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#111111" font-weight="bold">FIG-CE5-006 — Contrast felt reliability with controls and evidence.</text><text x="24" y="46" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: see metadata · Color is not the sole encoding</text><text x="24" y="62" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence: educational original</text><text x="24" y="380" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Contrast felt reliability with controls and evidence.</text><text x="24" y="380" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">dual ledger Truth: illustrative. Color is not the sole encoding.</text><rect x="40" y="100" width="420" height="220" fill="#fafafa" stroke="#111111" stroke-width="1.75" />
<text x="250.0" y="210.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Felt reliability</text>
<text x="60" y="160" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• "It feels safe"</text>
<text x="60" y="190" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Familiar brand chrome</text>
<text x="60" y="220" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Smooth UX</text>
<rect x="500" y="100" width="420" height="220" fill="#ffffff" stroke="#111111" stroke-width="1.75" />
<text x="710.0" y="210.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Technical trust ledger</text>
<text x="520" y="160" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Controls (authn/z, crypto)</text>
<text x="520" y="190" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Evidence artifacts (logs, audits)</text>
<text x="520" y="220" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">• Limits of each control</text>
<text x="40" y="370" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Dual ledger: feelings vs controls+evidence. Words encode columns.</text>
  </svg>
