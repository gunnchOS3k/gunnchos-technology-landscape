<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="FIG-CE5-001-title FIG-CE5-001-desc" data-figure-id="FIG-CE5-001" data-truth-classification="illustrative" data-template="tmpl-ecosystem-system-map" data-qualification="">
  <title id="FIG-CE5-001-title">FIG-CE5-001: Show accessible systems path without anthropomorphizing the model.</title>
  <desc id="FIG-CE5-001-desc">Flowchart from user prompt through application and model inference to on-screen output, with a side path for optional logging. Reading order: Prompt; Application; Model inference; On-screen output; Optional logging. Show accessible systems path without anthropomorphizing the model. From prompt to output — data, model, inference Truth: illustrative. Color is not the sole encoding.</desc>
  <rect width="1000" height="360" fill="#ffffff" />
  <rect x="1" y="1" width="998" height="358" fill="none" stroke="#222222" stroke-width="2" />
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111" />
    </marker>
  </defs>

<text x="24" y="28" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#111111" font-weight="bold">FIG-CE5-001 — Show accessible systems path without anthropomorphizing the model.</text><text x="24" y="46" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: see metadata · Color is not the sole encoding</text><text x="24" y="62" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence: educational original</text><text x="24" y="340" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Caption: Show accessible systems path without anthropomorphizing the model.</text><rect x="40" y="140" width="160" height="70" fill="#f5f5f5" stroke="#111111" stroke-width="1.75" />
<text x="120.0" y="175.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">1 Prompt</text>
<line x1="200" y1="175" x2="240" y2="175" stroke="#111111" stroke-width="1.75" marker-end="url(#arr)" />
<rect x="240" y="140" width="160" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75" />
<text x="320.0" y="175.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">2 Application</text>
<line x1="400" y1="175" x2="440" y2="175" stroke="#111111" stroke-width="1.75" marker-end="url(#arr)" />
<rect x="440" y="140" width="160" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.75" />
<text x="520.0" y="175.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">3 Inference</text>
<line x1="600" y1="175" x2="640" y2="175" stroke="#111111" stroke-width="1.75" marker-end="url(#arr)" />
<rect x="640" y="140" width="160" height="70" fill="#f5f5f5" stroke="#111111" stroke-width="1.75" />
<text x="720.0" y="175.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">4 Output</text>
<rect x="440" y="250" width="160" height="50" fill="#ffffff" stroke="#1F4B7A" stroke-width="1.75" stroke-dasharray="6 4" />
<text x="520.0" y="269.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#111111">Optional logging</text>
<text x="520.0" y="289.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">side path</text>
<line x1="520" y1="210" x2="520" y2="250" stroke="#1F4B7A" stroke-width="1.5" stroke-dasharray="6 4" />
<text x="40" y="340" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Accessible systems path — model not anthropomorphized.</text>
