  <title id="FIG-CE5-004-title">FIG-CE5-004: Show what encryption can and cannot guarantee for user experience.</title>
  <desc id="FIG-CE5-004-desc">Diagram of data encrypted between device and server, stored encrypted at rest, then readable on an unlocked authenticated endpoint. Reading order: Transit encrypted; At rest encrypted; Endpoint readable; What encryption cannot guarantee.</desc>
  <rect width="960" height="380" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="378" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="30" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">FIG-CE5-004 — Show what encryption can and cannot guarantee for user experience.</text>
  <text x="24" y="50" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">truth_classification: illustrative · Color is not the sole encoding</text>
  <text x="24" y="68" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#666666">Evidence: educational original</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>

