<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img"
     aria-labelledby="fig-ch26-003-title fig-ch26-003-desc"
     data-figure-id="FIG-CH26-003">
  <title id="fig-ch26-003-title">Secrets must not enter the repository</title>
  <desc id="fig-ch26-003-desc">Boundary diagram: working-tree edits may contain secrets; a refuse-line blocks credentials, tokens, and private keys from entering commits and history. Allowed path: reviewable code and docs without secrets. Reading order: Working tree; Secrets scan refuse-line; Blocked from history; Allowed into commit/history. Conceptual teaching figure. Color is not the sole encoding.</desc>
  <defs>
    <marker id="arr-fig-ch26-003" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="418" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">FIG-CH26-003 — Secrets must not enter the repository</text>
  <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Truth: conceptual · Refuse-line for credentials / tokens / keys · Color is not the sole encoding</text>

  <rect x="40" y="120" width="220" height="100" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="150" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">1 Working tree</text>
  <text x="150" y="180" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">edits on disk now</text>
  <text x="150" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">may still hold secrets</text>

  <line x1="260" y1="170" x2="320" y2="170" stroke="#111111" stroke-width="2" marker-end="url(#arr-fig-ch26-003)"/>

  <rect x="320" y="110" width="260" height="120" fill="#ffffff" stroke="#1F4B7A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="450" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">2 Secrets scan (human)</text>
  <text x="450" y="168" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">REFUSE LINE</text>
  <text x="450" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">passwords · API tokens · private keys</text>
  <text x="450" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">even in “temporary” files</text>

  <line x1="580" y1="140" x2="660" y2="100" stroke="#1F4B7A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-fig-ch26-003)"/>
  <line x1="580" y1="200" x2="660" y2="250" stroke="#111111" stroke-width="2" marker-end="url(#arr-fig-ch26-003)"/>

  <rect x="660" y="60" width="290" height="90" fill="#ffffff" stroke="#1F4B7A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="805" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">3a Blocked from history</text>
  <text x="805" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">do not commit · do not push</text>

  <rect x="660" y="210" width="290" height="90" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  <text x="805" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#111111">3b Allowed into commit</text>
  <text x="805" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555555">reviewable code / docs without secrets</text>

  <text x="24" y="370" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Dashed box + dashed arrow = refuse / blocked path · Solid = allowed snapshot path</text>
  <text x="24" y="396" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Conceptual educational boundary; not a product security audit. Once committed, assume secrets may already be copied.</text>
</svg>
