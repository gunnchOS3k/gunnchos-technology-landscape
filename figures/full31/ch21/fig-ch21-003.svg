<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img"
     aria-labelledby="fig-ch21-003-title fig-ch21-003-desc"
     data-figure-id="FIG-CH21-003">
  <title id="fig-ch21-003-title">Fluency vs correctness vs evaluation evidence</title>
  <desc id="fig-ch21-003-desc">Fluency vs correctness vs evaluation evidence. Truth class: conceptual. Three families that must not collapse: Fluency (does it sound coherent?), Correctness (is the claim accurate for this task?), Evaluation evidence (what labeled checks support usefulness?). Conceptual/illustrative teaching figure; not measured data. No invented physical measurements.</desc>
  <defs>
    <marker id="arr-fig-ch21-003" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="418" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="24" y="32" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#111111">Fluency vs correctness vs evaluation evidence</text>
  <text x="24" y="52" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">FIG-CH21-003 · truth: conceptual · educational architecture (not a product measurement)</text>
  <rect x="40" y="90" width="280" height="230" fill="#f7f7f7" stroke="#111111" stroke-width="2"/>
  <text x="180" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Fluency</text>
  <text x="180" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Does it sound coherent?</text>
  <text x="180" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Not proof of truth</text>
  <rect x="360" y="90" width="280" height="230" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="500" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Correctness</text>
  <text x="500" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">Is the claim accurate</text>
  <text x="500" y="184" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">for this task?</text>
  <text x="500" y="214" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Not one lucky answer</text>
  <rect x="680" y="90" width="280" height="230" fill="#f7f7f7" stroke="#111111" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="820" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#111111">Evaluation evidence</text>
  <text x="820" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">What labeled checks</text>
  <text x="820" y="184" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111111">support usefulness?</text>
  <text x="820" y="214" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333333">Fixtures ≠ human validation</text>
  <text x="500" y="360" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Do not collapse the three families into “the AI was right”</text>
  <text x="24" y="400" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#555555">Conceptual/illustrative teaching figure; not measured data. No invented physical measurements.</text>
</svg>
