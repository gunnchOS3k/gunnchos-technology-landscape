<svg xmlns="http://www.w3.org/2000/svg" width="920" height="332" role="img" aria-label="Stacked layers from application down through runtime, libraries, kernel, drivers, firmware, and hardware.">
<title>FIG-CH02-004: Software Stack</title>
<desc>A vertical stack with Application at top and Hardware at bottom. The tap event rises through drivers/kernel toward the application; rendered output descends toward display hardware.</desc>
<rect width="100%" height="100%" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="20" y="28" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#111">FIG-CH02-004 — Software Stack</text>
<text x="20" y="50" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">Status: conceptual · Representative educational diagram · Color is not the sole encoding</text>
<rect x="20" y="60" width="880" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="32" y="78" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#111">1. Application</text>
<rect x="20" y="96" width="880" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="32" y="114" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#111">2. Runtime/framework</text>
<rect x="20" y="132" width="880" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="32" y="150" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#111">3. Libraries and system services</text>
<rect x="20" y="168" width="880" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="32" y="186" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#111">4. Kernel</text>
<rect x="20" y="204" width="880" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="32" y="222" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#111">5. Drivers</text>
<rect x="20" y="240" width="880" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="32" y="258" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#111">6. Firmware</text>
<rect x="20" y="276" width="880" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
<text x="32" y="294" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#111">7. Hardware</text>
</svg>
