lab_id: LAB-IO-001
title: Map One Media Pipeline (Capture → Process → Present)
chapter: CH08
version: "0.1.0"
status: DRAFT_DIGITAL
question: "For one familiar media experience, what is the capture → process → present path—and which parts can I observe without capturing other people?"
experience: "Video, audio, notifications, and sensors share one device’s budgets; permissions and fixtures keep labs ethical."
reader_levels: [explorer, operator, builder, engineer, researcher, educator]
routes:
  fixture: labs/LAB-IO-001/fixtures/pipeline_map.md
  worksheet: labs/LAB-IO-001/fixtures/observation_sheet.md
fixture_available: true
no_specialized_hardware: true
device_quartet_required: false
privacy_boundary:
  - Do not capture other people’s faces, voices, screens, or private spaces without explicit permission.
  - Prefer fixtures, public-domain still images of yourself you already own, or synthetic placeholder media.
  - Do not enable always-on microphone or camera recording for this lab.
  - Scrub filenames and EXIF that contain location or personal identifiers before portfolio save.
safety_boundary:
  - No device rooting or jailbreaking.
  - No unsafe thermal/power abuse to force glitches.
  - Stop if permission prompts would unlock access you are not allowed to use in your setting.
evidence_artifacts:
  - pipeline_map
  - permission_notes
  - observation_vs_inference
  - teach_back
portfolio_output:
  - portfolio/README.md
  - portfolio/pipeline_map.md
  - portfolio/observation_vs_inference.md
  - portfolio/teach_back.md
waike_note: "Publication-owned commodity lab. Adjacent WAIKE competencies exist (game loop, sensor noise, ADC scale); do not mint a WAIKE lab ID for LAB-IO-001."
gate_note: "GATE_3_IN_PROGRESS — READER_EVIDENCE_PENDING"

prerequisites:
  concepts: [media-pipeline, sampling, permission, observation]
  safety:
    - Do not capture other people without permission.
    - Prefer fixtures or synthetic media.
  time_minutes: 45
  equipment: []
  software: [text editor; optional local media player]
accessible_routes:
  no_specialized_hardware: true
  supplied_fixture: true
  simulation: true
prediction:
  required: true
procedure:
  checkpoints:
    - Predict capture → process → present stages for one familiar media experience.
    - Complete fixture/worksheet map without capturing other people.
    - Note permission outcomes as policy, not broken hardware.
    - Separate observation from inference; no hitch-threshold inventions.
  rollback:
    - Deny or revoke camera/mic permissions used only for the lab.
    - Delete accidental sensitive media.
evidence:
  required_artifacts:
    - pipeline_map
    - permission_notes
    - observation_vs_inference
    - teach_back
interpretation:
  observation_required: true
  inference_required: true
  causation_warning: true
limits:
  confounders:
    - permission prompts
    - shared CPU/GPU/memory/power budgets
    - opaque vendor media pipelines
  uncertainty:
    - fixture paths are illustrative
    - learner observations are device-local, not product SLOs
portfolio:
  outputs:
    - README.md
    - pipeline_map.md
    - observation_vs_inference.md
    - teach_back.md
teach_back:
  required: true
