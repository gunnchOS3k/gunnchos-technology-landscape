# CE lab package contract (minimal compatible schema)
# Status vocabulary never includes PASS for human learning outcomes.
schema_version: "1.0.0"
description: >
  Shared contract for Concept Edition runnable lab packages under labs/.
  Lab YAML should populate the required_fields below.

allowed_status:
  - IMPLEMENTED_DIGITAL
  - FIXTURE_VALIDATED
  - PHYSICAL_PENDING
  - EXTERNAL_DEPENDENCY

disallowed_status:
  - PASS
  - GATE_3_PASS
  - HUMAN_LEARNING_PASS

required_fields:
  - lab_id
  - chapter
  - version
  - status
  - reader_levels
  - routes
  - fixture_available
  - evidence_artifacts
  - privacy_boundary
  - safety_boundary
  - accessibility_notes
  - observation_inference_boundary
  - portfolio_output

field_notes:
  lab_id: Stable publication lab ID (e.g., LAB-CMS-001).
  chapter: Concept Edition module or chapter code (e.g., CE-3).
  version: Semver string for the lab package.
  status: One or more values from allowed_status.
  reader_levels: Pathway depths such as explorer, operator, builder, engineer, researcher, educator.
  routes: Named accessible routes (commodity computer, fixture, etc.).
  fixture_available: Boolean; true when offline teaching fixtures are supplied.
  evidence_artifacts: List of required learner evidence artifact types.
  privacy_boundary: Rules for what must not be captured or shared.
  safety_boundary: Stop rules and non-destructive constraints.
  accessibility_notes: Keyboard, text-equivalent, and equity accommodations.
  observation_inference_boundary: Explicit observation vs labeled-inference rules.
  portfolio_output: Expected portfolio folder contents.

compatibility:
  also_supports_legacy_lab_yaml_keys:
    - title
    - question
    - prerequisites
    - accessible_routes
    - prediction
    - procedure
    - evidence
    - interpretation
    - limits
    - portfolio
    - teach_back
