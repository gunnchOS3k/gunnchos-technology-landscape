schema_version: 1.0.0
chapter_id: CE-1
objectives:
- objective_id: LO-CE1-EX-01
  text: Given a familiar app-opening moment, label at least three visible cues and
    at least three hidden cooperating parts using ordinary language.
  reader_pathways:
  - explorer
  evidence_artifact: Labeled sketch or bullet map with visible vs hidden columns.
- objective_id: LO-CE1-EX-02
  text: Explain in one short paragraph why 'the app' is usually not a single object.
  reader_pathways:
  - explorer
  evidence_artifact: Teach-back paragraph that names UI, local software, and at least
    one optional remote dependency without jargon overload.
- objective_id: LO-CE1-EX-03
  text: Identify one everyday failure that can occur while the screen still looks
    'normal.'
  reader_pathways:
  - explorer
  evidence_artifact: Written example with symptom + guessed failure domain marked
    as inference, not proven cause.
- objective_id: LO-CE1-OP-01
  text: On a commodity device, compare a local-only readiness path with a network-dependent
    readiness path and record observed differences.
  reader_pathways:
  - operator
  evidence_artifact: 'Observation table: action, chrome-visible time, content-usable
    time, offline vs online condition.'
- objective_id: LO-CE1-OP-02
  text: Name the likely failure domain (input/UI, local app/OS, storage, network/service,
    human perception) for two distinct symptoms without claiming root cause certainty.
  reader_pathways:
  - operator
  evidence_artifact: "Two symptom\u2192domain tickets with observation vs inference\
    \ labels."
- objective_id: LO-CE1-OP-03
  text: List dependencies that must remain within acceptable bounds for the anchor
    experience to stay usable (qualitative).
  reader_pathways:
  - operator
  evidence_artifact: "Stability checklist of \u22655 conditions tied to the anchor\
    \ experience."
- objective_id: LO-CE1-BU-01
  text: Construct a personal technology-ecosystem map for one chosen experience with
    named layers and at least one optional branch.
  reader_pathways:
  - builder
  evidence_artifact: Diagram or structured YAML/Markdown map with layer labels and
    optional network/service branch.
- objective_id: LO-CE1-BU-02
  text: Modify a simple readiness checklist template to match the learner's chosen
    experience and document one tradeoff.
  reader_pathways:
  - builder
  evidence_artifact: Edited checklist + tradeoff note (e.g., richer logging vs privacy).
- objective_id: LO-CE1-EN-01
  text: Propose a diagnosis plan that separates observation, interpretation, and causal
    claims for a readiness failure.
  reader_pathways:
  - engineer
  evidence_artifact: Diagnosis plan with evidence needed before blaming network vs
    app vs device.
- objective_id: LO-CE1-EN-02
  text: Relate the CE-1 layer map to at least one standards-or-textbook abstraction
    (process, event, packet, or storage hierarchy) without inventing measurements.
  reader_pathways:
  - engineer
  evidence_artifact: "Short mapping table: CE-1 layer \u2194 cited abstraction \u2194\
    \ citation key."
- objective_id: LO-CE1-RE-01
  text: State a testable hypothesis about chrome-visible vs content-usable timing
    under two controlled conditions (e.g., airplane mode on/off).
  reader_pathways:
  - researcher
  evidence_artifact: Hypothesis + variables + planned N runs + explicit limits (not
    a published benchmark).
- objective_id: LO-CE1-RE-02
  text: Document uncertainty and what evidence would be required to upgrade an illustrative
    claim to a measured claim.
  reader_pathways:
  - researcher
  evidence_artifact: Claim triage note with status change criteria.
- objective_id: LO-CE1-ED-01
  text: "Facilitate a 10\u201315 minute misconception check distinguishing screen-as-system\
    \ from screen-as-surface."
  reader_pathways:
  - educator
  evidence_artifact: Facilitation notes + two probe questions + expected wrong answers.
- objective_id: LO-CE1-ED-02
  text: Adapt LAB-SYS-001 for a no-specialized-hardware classroom including an offline/fixture
    fallback.
  reader_pathways:
  - educator
  evidence_artifact: Adapted lab sheet with fallback route and accessibility notes.
maps_to:
- CH01
teaching_model: "Human experience \u2192 system \u2192 component \u2192 code \u2192\
  \ network \u2192 society"
anchor_experience: chrome_visible_before_content_usable
