- provisional_id: CLM-CE5-004
  text: At a systems level, many modern AI features can be taught as data conditioning
    a model whose parameters are applied at inference time to produce outputs.
  claim_class: general_technical
  evidence_required: Primary source citation
  preferred_source_type: textbook or official documentation
  status: SOURCE_IDENTIFIED
  citation_keys:
  - russell_norvig_aima
  - goodfellow_deep_learning
  overclaim_risk: '["The model understands the user''s intent", ''Neural nets think'']'
  wording_boundary: "approved: Accessible systems framing: data \u2192 model \u2192\
    \ inference/output. | prohibited: The model understands the user's intent; Neural\
    \ nets think"
- provisional_id: CLM-CE5-005
  text: NIST AI RMF 1.0 provides voluntary organizational guidance for managing AI
    risks and discussing trustworthy/responsible AI system characteristics without
    treating trust as a binary property of 'AI' itself.
  claim_class: standards_based
  evidence_required: Primary source citation
  preferred_source_type: standards/specifications
  status: SOURCE_IDENTIFIED
  citation_keys:
  - nist_ai_rmf_100_1
  overclaim_risk: '[''AI is inherently trustworthy'', ''AI is inherently untrustworthy'']'
  wording_boundary: 'approved: Use NIST AI RMF language for organizational risk management
    and characteristics of trustworthy AI systems. | prohibited: AI is inherently
    trustworthy; AI is inherently untrustworthy'
- provisional_id: CLM-CE5-006
  text: Digital identity guidance distinguishes assurance concepts around identity
    proofing and authentication; authorization remains a separate access-decision
    concern in systems teaching.
  claim_class: standards_based
  evidence_required: Primary source citation
  preferred_source_type: standards/specifications
  status: SOURCE_IDENTIFIED
  citation_keys:
  - nist_sp_800_63_4
  overclaim_risk: '[''Login alone proves entitlement to all actions'']'
  wording_boundary: 'approved: Separate identity, authentication, and authorization
    in learner language. | prohibited: Login alone proves entitlement to all actions'
- provisional_id: CLM-CE5-007
  text: Classical protection design principles (e.g., least privilege, fail-safe defaults,
    psychological acceptability) remain useful for connecting security controls to
    usable experience.
  claim_class: peer_reviewed
  evidence_required: Primary source citation
  preferred_source_type: peer-reviewed literature
  status: SOURCE_IDENTIFIED
  citation_keys:
  - saltzer_schroeder_1975
  overclaim_risk: '[''Detached vulnerability trivia without user-visible consequence'']'
  wording_boundary: 'approved: Teach security principles as UX-compatible design constraints.
    | prohibited: Detached vulnerability trivia without user-visible consequence'
- provisional_id: CLM-CE5-008
  text: Illustrative local-vs-cloud latency/privacy comparison tables in CE-5 figures/labs
