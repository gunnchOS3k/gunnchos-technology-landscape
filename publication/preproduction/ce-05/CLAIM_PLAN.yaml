  - claim_id: CLM-CE5-004
    text: "At a systems level, many modern AI features can be taught as data conditioning a model whose parameters are applied at inference time to produce outputs."
    scope: general-knowledge
    classification: textbook
    status: planned
    evidence:
      bib_keys: [russell_norvig_aima, goodfellow_deep_learning]
    wording:
      approved: "Accessible systems framing: data → model → inference/output."
      prohibited:
        - "The model understands the user's intent"
        - "Neural nets think"

  - claim_id: CLM-CE5-005
    text: "NIST AI RMF 1.0 provides voluntary organizational guidance for managing AI risks and discussing trustworthy/responsible AI system characteristics without treating trust as a binary property of 'AI' itself."
    scope: standards
    classification: standard
    status: verified
    evidence:
      bib_keys: [nist_ai_rmf_100_1]
      url: "https://doi.org/10.6028/NIST.AI.100-1"
    wording:
      approved: "Use NIST AI RMF language for organizational risk management and characteristics of trustworthy AI systems."
      prohibited:
        - "AI is inherently trustworthy"
        - "AI is inherently untrustworthy"

  - claim_id: CLM-CE5-006
    text: "Digital identity guidance distinguishes assurance concepts around identity proofing and authentication; authorization remains a separate access-decision concern in systems teaching."
    scope: standards
    classification: standard
    status: verified
    evidence:
      bib_keys: [nist_sp_800_63_4]
      url: "https://doi.org/10.6028/NIST.SP.800-63-4"
      note: "SP 800-63-3 withdrawn 2025-08-01; superseded by SP 800-63-4 (July 2025)."
    wording:
      approved: "Separate identity, authentication, and authorization in learner language."
      prohibited:
        - "Login alone proves entitlement to all actions"

  - claim_id: CLM-CE5-007
    text: "Classical protection design principles (e.g., least privilege, fail-safe defaults, psychological acceptability) remain useful for connecting security controls to usable experience."
    scope: peer-reviewed
    classification: peer-reviewed
    status: verified
    evidence:
      bib_keys: [saltzer_schroeder_1975]
      url: "https://doi.org/10.1109/PROC.1975.9939"
    wording:
      approved: "Teach security principles as UX-compatible design constraints."
      prohibited:
        - "Detached vulnerability trivia without user-visible consequence"

  - claim_id: CLM-CE5-008
    text: "Illustrative local-vs-cloud latency/privacy comparison tables in CE-5 figures/labs are teaching aids unless a measurement bundle is attached."
    scope: publication-internal
