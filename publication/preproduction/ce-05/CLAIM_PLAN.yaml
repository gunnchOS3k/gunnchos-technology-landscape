  claim_class: publication_internal
  evidence_required: Illustrative teaching construct only
  preferred_source_type: publication-internal
  status: ILLUSTRATIVE_ONLY
  citation_keys: []
  overclaim_risk: '[''Claimed measured on-device vs cloud latency for gunnchOS SKUs
