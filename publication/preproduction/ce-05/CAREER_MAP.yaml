# CE-5 Career Map (chapter-local)
chapter_id: CE-5
status: preproduction
employment_guarantee: false
note: >
  Roles describe ownership and portfolio analogues only. Do not promise jobs or salaries.

roles:
  - role_id: ROLE-CE5-ML
    title: "Machine Learning / Applied AI Engineer"
    owns: ["inference path design", "evaluation of error modes", "local vs remote deployment tradeoffs"]
    layers: ["Model", "Inference", "Data"]
    tools: ["notebooks", "eval harnesses", "model cards"]
    professional_artifact: "evaluation report with limitations"
    learner_portfolio_analogue: "LAB-TRUST-001 uncertainty note + comparison table"
    related_concepts: [CX-CE5-INFERENCE, CX-CE5-UNCERTAINTY, CX-CE5-LOCALCLOUD]

  - role_id: ROLE-CE5-SEC
    title: "Cybersecurity Engineer"
    owns: ["UX-linked threat model", "control review", "session/identity risk notes"]
    layers: ["Cross-cutting", "Identity", "Network"]
    tools: ["threat-model templates", "policy reviews"]
    professional_artifact: "threat model / control review"
    learner_portfolio_analogue: "FIG-CE5-007 annotation worksheet (no exploits)"
    related_concepts: [CX-CE5-ATTACKSURFACE, CX-CE5-AUTHN, CX-CE5-AUTHZ]

  - role_id: ROLE-CE5-PRIVACY
    title: "Privacy Engineer / Analyst"
    owns: ["data lifecycle map", "consent language review", "retention/deletion evidence"]
    layers: ["Policy", "Data", "Application"]
    tools: ["DPIA-style worksheets", "data inventories"]
    professional_artifact: "privacy review memo"
    learner_portfolio_analogue: "consent/trust card from LAB-TRUST-001"
    related_concepts: [CX-CE5-PRIVACY, CX-CE5-LIFECYCLE]

  - role_id: ROLE-CE5-IAM
    title: "Identity / IAM Engineer"
    owns: ["authn assurance choices", "authz matrix", "recovery UX risks"]
    layers: ["Identity", "Application"]
    tools: ["IdP configs", "RBAC/ABAC reviews"]
    professional_artifact: "identity assurance + authz design note"
    learner_portfolio_analogue: "authn/authz decision card"
    related_concepts: [CX-CE5-IDENTITY, CX-CE5-AUTHN, CX-CE5-AUTHZ]

  - role_id: ROLE-CE5-SRE
    title: "SRE / Reliability Engineer"
    owns: ["usable uptime of AI/auth dependencies", "error budgets for verify flows"]
    layers: ["Service", "Network"]
    tools: ["metrics", "traces", "status pages"]
    professional_artifact: "dependency failure blameless note"
    learner_portfolio_analogue: "connected-vs-usable table for assistant outage"
    related_concepts: [CX-CE5-TRUST, CX-CE5-LOCALCLOUD]

  - role_id: ROLE-CE5-A11Y
    title: "Accessibility Engineer"
    owns: ["accessible auth and disclosure", "AT-friendly AI UI semantics"]
    layers: ["Interaction"]
    tools: ["screen readers", "keyboard checks", "a11y linters"]
    professional_artifact: "accessibility review of verify + disclosure flows"
    learner_portfolio_analogue: "no-device / keyboard lab completion notes"
    related_concepts: [CX-CE5-RESPONSIBLE, CX-CE5-TRUST]

  - role_id: ROLE-CE5-FRONTEND
    title: "Frontend / UX Engineer"
    owns: ["permission UX", "uncertainty presentation", "trusted UI patterns"]
    layers: ["Interaction", "Application"]
    tools: ["design systems", "DevTools"]
    professional_artifact: "interaction spec for consent + hedges"
    learner_portfolio_analogue: "Explorer observation journal + UI friction list"
    related_concepts: [CX-CE5-UNCERTAINTY, CX-CE5-RESPONSIBLE]

  - role_id: ROLE-CE5-RESEARCH
    title: "Researcher (AI/security/privacy)"
    owns: ["hypothesis", "uncertainty reporting", "limitation statements"]
    layers: ["Method"]
    tools: ["stats notebooks", "reproducible scripts"]
    professional_artifact: "experiment report with uncertainty"
    learner_portfolio_analogue: "researcher extension on LAB-TRUST-001"
    related_concepts: [CX-CE5-UNCERTAINTY, CX-CE5-DATA]

  - role_id: ROLE-CE5-TPM
    title: "Technical Program Manager"
    owns: ["cross-team trust boundaries", "risk register across ML/security/privacy"]
    layers: ["Cross-cutting"]
    tools: ["risk registers", "RACI"]
    professional_artifact: "integration plan for AI feature launch gates"
    learner_portfolio_analogue: "Stability Contract ownership map"
    related_concepts: [CX-CE5-TRUST, CX-CE5-RESPONSIBLE]

  - role_id: ROLE-CE5-EDU
    title: "Educator / Mentorship facilitator"
    owns: ["misconception detection", "lab adaptation", "inclusive pacing"]
    layers: ["Learning"]
    tools: ["rubrics", "facilitation guides"]
    professional_artifact: "lesson adaptation notes"
    learner_portfolio_analogue: "teach-back + misconception drill facilitation"
    related_concepts: [CX-CE5-TRUST, CX-CE5-GENAI]

pathway_highlights:
  explorer: [ROLE-CE5-FRONTEND, ROLE-CE5-EDU]
  operator: [ROLE-CE5-IAM, ROLE-CE5-SRE]
  builder: [ROLE-CE5-ML, ROLE-CE5-PRIVACY]
  engineer: [ROLE-CE5-SEC, ROLE-CE5-ML, ROLE-CE5-IAM]
  researcher: [ROLE-CE5-RESEARCH]
  educator: [ROLE-CE5-EDU, ROLE-CE5-A11Y]
