status: CANDIDATE_PREPRODUCTION
gate_note: GATE_3_IN_PROGRESS — READER_EVIDENCE_PENDING
rights: Does not modify glossary/glossary.yaml or CH02-REVIEW-R1. Integrator merge
  candidates only.
entries:
- source_package: ce-01
  concept_id: CX-CE1-001
  term: visible interface
  plain_definition: What a person can see or hear on the device surface (screen chrome,
    icons, sound, haptics) without needing to know hidden machinery.
  introduced_here: true
  depends_on: []
- source_package: ce-01
  concept_id: CX-CE1-002
  term: hidden layers
  plain_definition: Cooperating parts under the interface—local software, operating-system
    services, storage, power, and optional network/services—that the person does not
    see directly.
  introduced_here: true
  depends_on:
  - CX-CE1-001
- source_package: ce-01
  concept_id: CX-CE1-003
  term: technology ecosystem
  plain_definition: The set of cooperating human, device, software, data, and optional
    network parts that together produce a usable experience.
  introduced_here: true
  depends_on:
  - CX-CE1-001
  - CX-CE1-002
- source_package: ce-01
  concept_id: CX-CE1-004
  term: inputs → processing → state → outputs
  plain_definition: 'A teaching path: something enters the system, work happens, remembered
    conditions update, then a result returns to the person.'
  introduced_here: true
  depends_on:
  - CX-CE1-003
- source_package: ce-01
  concept_id: CX-CE1-005
  term: application state
  plain_definition: What the software currently 'remembers' about the session or screen—selected
    items, loaded content, login session, draft text—so the interface can be rebuilt.
  introduced_here: true
  depends_on:
  - CX-CE1-004
- source_package: ce-01
  concept_id: CX-CE1-006
  term: dependency
  plain_definition: A condition or component the experience needs—local storage available,
    process scheduled, optional network path, valid session—so the usable result can
    appear.
  introduced_here: true
  depends_on:
  - CX-CE1-003
- source_package: ce-01
  concept_id: CX-CE1-007
  term: failure domain
  plain_definition: A useful bucket for where trouble may live (UI, local app/OS,
    storage, network/service, human perception) before claiming a precise root cause.
  introduced_here: true
  depends_on:
  - CX-CE1-006
- source_package: ce-01
  concept_id: CX-CE1-008
  term: optional network/service branch
  plain_definition: A path some experiences take to machines or services beyond the
    local device; many experiences never need it.
  introduced_here: true
  depends_on:
  - CX-CE1-004
  - CX-CE1-006
- source_package: ce-01
  concept_id: CX-CE1-009
  term: the app is not one thing
  plain_definition: Everyday 'app' talk usually compresses UI, runtime, OS services,
    storage, optional networking, and remote services into one word.
  introduced_here: true
  depends_on:
  - CX-CE1-003
  - CX-CE1-005
  - CX-CE1-008
- source_package: ce-01
  concept_id: CX-CE1-010
  term: observation vs inference
  plain_definition: Observation is what you directly saw or recorded; inference is
    a possible explanation that still needs evidence.
  introduced_here: true
  depends_on: []
- source_package: ce-01
  concept_id: CX-CE1-011
  term: stability contract (preview)
  plain_definition: A usable experience continues only while multiple hidden conditions
    stay within acceptable bounds; a system can look 'connected' after the human experience
    has already failed.
  introduced_here: true
  depends_on:
  - CX-CE1-006
  - CX-CE1-007
- source_package: ce-01
  concept_id: CX-CE1-012
  term: Device Quartet (learning laboratory foreshadow)
  plain_definition: Four research form factors used across the publication as recurring
    learning benchmarks (desk, handheld hybrid, learn-to-build coder, embodied wearables)—not
    finished commercial products.
  introduced_here: true
  depends_on:
  - CX-CE1-003
- source_package: ce-03
  concept_id: instruction-execution
  term: Instruction execution
  plain_definition: 'The CPU carries out a program one instruction (or a small group)
    at a time: fetch, decode, execute, write results.'
  introduced_here: true
  depends_on: []
- source_package: ce-03
  concept_id: cpu
  term: CPU
  plain_definition: The general-purpose processor that executes most program instructions
    for apps and the OS.
  introduced_here: false
  depends_on:
  - instruction-execution
- source_package: ce-03
  concept_id: accelerator-gpu
  term: Accelerator / GPU
  plain_definition: Specialized processors that take certain parallel jobs (graphics,
    media, some ML) off the CPU; the OS and drivers still mediate access.
  introduced_here: true
  depends_on:
  - cpu
- source_package: ce-03
  concept_id: register
  term: Register
  plain_definition: Tiny, extremely fast storage locations inside the CPU that hold
    values the processor is working on right now.
  introduced_here: true
  depends_on:
  - cpu
- source_package: ce-03
  concept_id: cache
  term: Cache
  plain_definition: Small, fast memory near the CPU that keeps recently used data
    so the processor waits less on slower RAM.
  introduced_here: false
  depends_on:
  - cpu
  - register
- source_package: ce-03
  concept_id: ram
  term: RAM
  plain_definition: 'The device''s main working memory: fast while powered, but not
    the durable home for files.'
  introduced_here: false
  depends_on:
  - cache
- source_package: ce-03
  concept_id: storage
  term: Storage
  plain_definition: Durable place for files and installed software that is meant to
    survive quitting apps and reboots (subject to failures).
  introduced_here: false
  depends_on: []
- source_package: ce-03
  concept_id: memory-hierarchy
  term: Memory hierarchy
  plain_definition: The layered stack from tiny/fast (registers, caches) to large/slower
    (RAM, storage) that makes programs practical.
  introduced_here: true
  depends_on:
  - register
  - cache
  - ram
  - storage
- source_package: ce-03
  concept_id: process
  term: Process
  plain_definition: An OS-managed running program instance with its own protected
    resources.
  introduced_here: false
  depends_on:
  - cpu
  - ram
- source_package: ce-03
  concept_id: thread
  term: Thread
  plain_definition: A schedulable stream of execution inside a process; one process
    may run many threads.
  introduced_here: false
  depends_on:
  - process
- source_package: ce-03
  concept_id: scheduler
  term: Scheduler
  plain_definition: The OS policy/mechanism that decides which ready thread/process
    runs on which CPU time slice.
  introduced_here: false
  depends_on:
  - process
  - thread
  - cpu
- source_package: ce-03
  concept_id: os-abstraction
  term: OS abstraction
  plain_definition: A simplified, safer interface the operating system presents (processes,
    files, virtual memory) so apps need not manage every hardware detail.
  introduced_here: true
  depends_on:
  - process
  - storage
  - scheduler
- source_package: ce-03
  concept_id: file-persistence
  term: File / persistence
  plain_definition: A named durable object managed by the OS/file system so data can
    outlive a process.
  introduced_here: true
  depends_on:
  - storage
  - os-abstraction
- source_package: ce-03
  concept_id: bottleneck-symptom
  term: Bottleneck symptom
  plain_definition: A human-visible slowdown pattern that suggests which resource
    is scarce—without by itself proving root cause.
  introduced_here: true
  depends_on:
  - cpu
  - ram
  - storage
  - scheduler
- source_package: ce-03
  concept_id: power-thermal-limit
  term: Power / thermal limit
  plain_definition: Hardware and firmware policies that reduce performance to stay
    within power or temperature budgets.
  introduced_here: true
  depends_on:
  - cpu
  - accelerator-gpu
- source_package: ce-03
  concept_id: virtual-memory
  term: Virtual memory
  plain_definition: OS technique that gives each process a private address space and
    can move less-used pages between RAM and storage.
  introduced_here: true
  depends_on:
  - ram
  - storage
  - os-abstraction
- source_package: ce-04
  concept_id: CE4-C-LOCAL-SCOPE
  term: local (on-device) scope
  plain_definition: Work that can complete using only resources already on the device,
    without leaving the enclosure.
  introduced_here: true
  depends_on: []
- source_package: ce-04
  concept_id: CE4-C-LAN-SCOPE
  term: LAN scope
  plain_definition: Reachability limited to a local network neighborhood (home/campus/office
    segment), not the global Internet.
  introduced_here: true
  depends_on:
  - CE4-C-LOCAL-SCOPE
- source_package: ce-04
  concept_id: CE4-C-INTERNET-SCOPE
  term: Internet scope
  plain_definition: Multi-network reachability across independently administered networks
    using shared addressing/routing conventions.
  introduced_here: true
  depends_on:
  - CE4-C-LAN-SCOPE
- source_package: ce-04
  concept_id: CE4-C-PACKET
  term: packet
  plain_definition: A bounded chunk of data plus headers that help different network
    workers deliver and interpret it.
  introduced_here: true
  depends_on:
  - CE4-C-LOCAL-SCOPE
- source_package: ce-04
  concept_id: CE4-C-ENCAPSULATION
  term: encapsulation
  plain_definition: Stacking headers like sticky notes—outer notes for nearer workers,
    inner notes for later ones.
  introduced_here: true
  depends_on:
  - CE4-C-PACKET
- source_package: ce-04
  concept_id: CE4-C-ADDRESSING
  term: addressing
  plain_definition: Identifiers that say who a packet is for (and often who sent it)
    at a given layer.
  introduced_here: true
  depends_on:
  - CE4-C-PACKET
- source_package: ce-04
  concept_id: CE4-C-ROUTING
  term: routing / forwarding
  plain_definition: Choosing the next hop for a packet toward its destination across
    interconnected networks.
  introduced_here: true
  depends_on:
  - CE4-C-ADDRESSING
  - CE4-C-INTERNET-SCOPE
- source_package: ce-04
  concept_id: CE4-C-DNS
  term: DNS name resolution
  plain_definition: A system that maps human-meaningful names to network addresses
    for a time, often with caching.
  introduced_here: true
  depends_on:
  - CE4-C-ADDRESSING
- source_package: ce-04
  concept_id: CE4-C-TRANSPORT
  term: transport (reliability mechanisms)
  plain_definition: End-to-end conversation rules that may detect loss, order data,
    or leave reliability to the application.
  introduced_here: true
  depends_on:
  - CE4-C-PACKET
- source_package: ce-04
  concept_id: CE4-C-WIFI
  term: Wi-Fi access
  plain_definition: A wireless LAN access technology that links devices to a local
    network neighborhood; it is not itself the Internet.
  introduced_here: true
  depends_on:
  - CE4-C-LAN-SCOPE
- source_package: ce-04
  concept_id: CE4-C-CELLULAR
  term: cellular access
  plain_definition: A mobile-operator radio access path that can provide on-ramps
    to operator networks and often the Internet; distinct from Wi-Fi.
  introduced_here: true
  depends_on:
  - CE4-C-INTERNET-SCOPE
- source_package: ce-04
  concept_id: CE4-C-RADIO-CONDITIONS
  term: radio / spectrum conditions (survey)
  plain_definition: Shared-medium and propagation realities (distance, obstacles,
    interference, congestion) that change wireless feel.
  introduced_here: true
  depends_on:
  - CE4-C-WIFI
  - CE4-C-CELLULAR
- source_package: ce-04
  concept_id: CE4-C-EDGE
  term: edge placement
  plain_definition: Putting compute or state closer to users or devices to meet latency,
    bandwidth, privacy, or continuity constraints.
  introduced_here: true
  depends_on:
  - CE4-C-INTERNET-SCOPE
- source_package: ce-04
  concept_id: CE4-C-CLOUD
  term: cloud placement
  plain_definition: On-demand networked access to shared configurable computing resources,
    often remote from the user device.
  introduced_here: true
  depends_on:
  - CE4-C-INTERNET-SCOPE
- source_package: ce-04
  concept_id: CE4-C-LATENCY
  term: latency
  plain_definition: How long it takes for a useful response to begin or complete along
    a path—experienced as delay.
  introduced_here: true
  depends_on:
  - CE4-C-PACKET
- source_package: ce-04
  concept_id: CE4-C-RELIABILITY
  term: reliability (connectivity experience)
  plain_definition: Whether needed messages arrive correctly often enough for the
    experience to continue, including under loss and change.
  introduced_here: true
  depends_on:
  - CE4-C-TRANSPORT
- source_package: ce-04
  concept_id: CE4-C-THROUGHPUT
  term: throughput
  plain_definition: How much useful data can be transferred per unit time—experienced
    as how long large transfers take.
  introduced_here: true
  depends_on:
  - CE4-C-PACKET
- source_package: ce-04
  concept_id: CE4-C-CONTINUITY
  term: service continuity
  plain_definition: Keeping the human experience working across changes in path, access
    network, or placement—not merely keeping a radio attached.
  introduced_here: true
  depends_on:
  - CE4-C-WIFI
  - CE4-C-CELLULAR
  - CE4-C-EDGE
  - CE4-C-CLOUD
- source_package: ce-05
  concept_id: CX-CE5-DATA
  term: Training and input data
  plain_definition: Examples and records used to fit a model or answer a question.
  introduced_here: CE-5
  depends_on:
  - CE-1
- source_package: ce-05
  concept_id: CX-CE5-MODEL
  term: Model parameters
  plain_definition: Stored numbers that shape how inputs become outputs; not a mind.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-DATA
- source_package: ce-05
  concept_id: CX-CE5-INFERENCE
  term: Inference / output
  plain_definition: Running the model on new inputs to produce a prediction or generated
    text.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-MODEL
- source_package: ce-05
  concept_id: CX-CE5-GENAI
  term: Generative AI (systems view)
  plain_definition: Systems that produce new text, images, or code by predicting likely
    continuations.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-INFERENCE
- source_package: ce-05
  concept_id: CX-CE5-LOCALCLOUD
  term: Local vs cloud AI
  plain_definition: Whether inference runs on your device or on someone else's computers.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-INFERENCE
- source_package: ce-05
  concept_id: CX-CE5-UNCERTAINTY
  term: Uncertainty and errors
  plain_definition: Outputs can be wrong, biased, or incomplete even when confident-sounding.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-GENAI
- source_package: ce-05
  concept_id: CX-CE5-ATTACKSURFACE
  term: Attack surface (UX-linked)
  plain_definition: Places where misuse can enter—through the same screens and flows
    people use.
  introduced_here: CE-5
  depends_on:
  - CE-1
- source_package: ce-05
  concept_id: CX-CE5-IDENTITY
  term: Identity
  plain_definition: A claim about who or what an actor is.
  introduced_here: CE-5
  depends_on: []
- source_package: ce-05
  concept_id: CX-CE5-AUTHN
  term: Authentication
  plain_definition: Checking that an identity claim is sufficiently believable for
    this risk.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-IDENTITY
- source_package: ce-05
  concept_id: CX-CE5-AUTHZ
  term: Authorization
  plain_definition: Deciding what an authenticated actor is allowed to do.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-AUTHN
- source_package: ce-05
  concept_id: CX-CE5-CRYPTO
  term: Encryption concepts
  plain_definition: Transforms that make data unreadable without keys; goals and limits
    matter.
  introduced_here: CE-5
  depends_on: []
- source_package: ce-05
  concept_id: CX-CE5-PRIVACY
  term: Privacy / data lifecycle
  plain_definition: Rules and practices for collect, use, retain, share, delete/redact.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-DATA
- source_package: ce-05
  concept_id: CX-CE5-LIFECYCLE
  term: Data lifecycle stages
  plain_definition: Named stages from collection through deletion or archival.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-PRIVACY
- source_package: ce-05
  concept_id: CX-CE5-TRUST
  term: Human trust vs technical trust
  plain_definition: Felt reliability versus controls and evidence that bound risk.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-UNCERTAINTY
  - CX-CE5-AUTHN
- source_package: ce-05
  concept_id: CX-CE5-RESPONSIBLE
  term: Responsible use
  plain_definition: Practices that align capability with disclosure, consent, equity,
    and accessibility.
  introduced_here: CE-5
  depends_on:
  - CX-CE5-TRUST
- source_package: ce-06
  concept_id: CE06-C-STABILITY-CONTRACT
  term: Stability Contract
  plain_definition: A user experience exists only while multiple hidden technical
    conditions remain within acceptable bounds at the same time.
  introduced_here: false
  depends_on:
  - CE06-C-CONCURRENT-CONDITIONS
  - CE06-C-CONNECTED-VS-USABLE
- source_package: ce-06
  concept_id: CE06-C-CONCURRENT-CONDITIONS
  term: Concurrent hidden conditions
  plain_definition: Multiple independent technical conditions (input delivery, scheduling,
    memory, network/service, render, power, trust, accessibility path, etc.) that
    must stay good enough together for the experience to succeed.
  introduced_here: true
  depends_on: []
- source_package: ce-06
  concept_id: CE06-C-CONNECTED-VS-USABLE
  term: Connected versus usable
  plain_definition: Link or service indicators can report connectivity while the human-facing
    experience has already failed.
  introduced_here: false
  depends_on: []
- source_package: ce-06
  concept_id: CE06-C-QOE
  term: Quality of Experience (QoE)
  plain_definition: Standards vocabulary for the degree of delight or annoyance of
    a user of an application or service; distinct from raw network probes.
  introduced_here: true
  depends_on:
  - CE06-C-CONNECTED-VS-USABLE
- source_package: ce-06
  concept_id: CE06-C-QOS
  term: Quality of Service (QoS)
  plain_definition: Characteristics of a telecommunications service that bear on its
    ability to satisfy stated and implied user needs; related to but not identical
    with QoE.
  introduced_here: true
  depends_on:
  - CE06-C-QOE
- source_package: ce-06
  concept_id: CE06-C-CROSS-LAYER-DIAGNOSIS
  term: Cross-layer failure diagnosis
  plain_definition: Structured practice of assigning symptoms to candidate layers/domains
    and seeking boundary evidence before declaring root cause.
  introduced_here: true
  depends_on:
  - CE06-C-CONCURRENT-CONDITIONS
  - CE06-C-OBS-VS-INFERENCE
- source_package: ce-06
  concept_id: CE06-C-EVIDENCE-HIERARCHY
  term: Evidence hierarchy
  plain_definition: 'Ordered strength of support: illustrative teaching aid → single-device
    observation → repeated/commodity measurement → correlated multi-signal evidence
    → standards-aligned QoE assessment methods.'
  introduced_here: true
  depends_on:
  - CE06-C-OBS-VS-INFERENCE
- source_package: ce-06
  concept_id: CE06-C-OBS-VS-INFERENCE
  term: Observation versus inference
  plain_definition: What was directly seen or recorded versus what is hypothesized;
    causal claims need extra evidence.
  introduced_here: false
  depends_on: []
- source_package: ce-06
  concept_id: CE06-C-OBSERVABILITY
  term: Observability
  plain_definition: Ability to understand system behavior from external signals such
    as logs, metrics, and traces — without claiming a specific vendor stack is required.
  introduced_here: true
  depends_on:
  - CE06-C-EVIDENCE-HIERARCHY
- source_package: ce-06
  concept_id: CE06-C-TRADEOFFS
  term: Experience tradeoffs
  plain_definition: Improving one contract dimension (e.g., richer telemetry, stronger
    checks, higher fidelity media) can worsen others (privacy, latency, cost, inclusion).
  introduced_here: true
  depends_on:
  - CE06-C-STABILITY-CONTRACT
- source_package: ce-06
  concept_id: CE06-C-EQUITY-A11Y-CONSEQUENCE
  term: Equity and accessibility consequence
  plain_definition: Contract failures and design assumptions can exclude people by
    device cost, network quality, disability, language, or offline constraints.
  introduced_here: true
  depends_on:
  - CE06-C-STABILITY-CONTRACT
  - CE06-C-TRADEOFFS
- source_package: ce-06
  concept_id: CE06-C-CAPSTONE-EMIT
  term: Explain–Measure–Improve–Teach
  plain_definition: 'Capstone spine: explain the ecosystem, measure what you can,
    propose an improvement with evidence criteria, and teach another person.'
  introduced_here: true
  depends_on:
  - CE06-C-STABILITY-CONTRACT
  - CE06-C-EVIDENCE-HIERARCHY
  - CE06-C-CROSS-LAYER-DIAGNOSIS
- source_package: ce-06
  concept_id: CE06-C-TEACH-BACK
  term: Teach-back
  plain_definition: Learner restates the model in their own words to demonstrate transfer,
    not memorization of slogans.
  introduced_here: false
  depends_on:
  - CE06-C-CAPSTONE-EMIT
- source_package: ce-06
  concept_id: CE06-C-PORTFOLIO-PROOF
  term: Portfolio proof
  plain_definition: Durable artifacts (tables, diagrams, redacted evidence, reflection,
    teach-back) that support claims — not a bare PASS string.
  introduced_here: false
  depends_on:
  - CE06-C-EVIDENCE-HIERARCHY
  - CE06-C-TEACH-BACK
