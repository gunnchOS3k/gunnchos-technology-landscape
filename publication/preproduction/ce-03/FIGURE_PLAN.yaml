schema_version: 1.0.0
chapter_id: CE-3
figures:
- provisional_id: FIG-CE3-001
  figure_type: system_map
  pedagogical_purpose: "Show person \u2192 app \u2192 process/threads \u2192 OS \u2192\
    \ CPU/GPU \u2192 memory hierarchy \u2192 storage \u2192 power/thermal in one readable\
    \ composition."
  reader_should_notice: '[''Network is optional/out-of-scope for the failure story
    when the connectivity icon is healthy.'', ''OS sits as mediator/scheduler, not
    as the sole compute engine.'']'
  data_or_evidence_source: conceptual_synthesis
  truth_classification: conceptual
  expected_geometry: Left-to-right or center-out layers with numbered callouts; no
    fake timing numbers.
  accessibility_description_requirement: 'alt_text_required: True; long_description_required:
    True; reading_order_required: True; color_independent_encoding: Shape + label
    + number; color never sole channel.'
  color_independent_encoding: Shape + label; color never sole cue.
  dependencies:
  - EXPERIENCE_MAP.md
  edition_scope: concept_edition
  title_intent: Inside-the-device map for local lag
- provisional_id: FIG-CE3-002
  figure_type: comparative_layers
  pedagogical_purpose: Make capacity/speed/volatility tradeoffs visible without invented
    nanosecond tables.
  reader_should_notice: "['RAM \u2260 storage', 'Closer to CPU is smaller/faster;\
    \ storage is durable home for files']"
  data_or_evidence_source: patterson-hennessy-riscv (qualitative hierarchy)
  truth_classification: conceptual
  expected_geometry: "Pyramid or stepped bars with qualitative adjectives only (tiny/fast\
    \ \u2192 large/durable)."
  accessibility_description_requirement: 'alt_text_required: True; long_description_required:
    True; reading_order_required: True; color_independent_encoding: Position + text
    labels for each layer.'
  color_independent_encoding: Shape + label; color never sole cue.
  dependencies:
  - CONCEPT_GRAPH.yaml
  edition_scope: concept_edition
  title_intent: "Memory hierarchy: registers \u2192 cache \u2192 RAM \u2192 storage"
- provisional_id: FIG-CE3-003
  figure_type: sequence_diagram
  pedagogical_purpose: Show a simplified path from runnable thread to CPU execution
    and UI-visible progress.
  reader_should_notice: '[''Scheduler chooses who runs'', ''App instructions still
    execute on the CPU/accelerator'']'
  data_or_evidence_source: tanenbaum-bos / linux-scheduler (concept-level)
  truth_classification: conceptual
  expected_geometry: 'Swimlanes: App thread | Scheduler | CPU | Memory | UI feedback.'
  accessibility_description_requirement: 'alt_text_required: True; long_description_required:
    True; reading_order_required: True; color_independent_encoding: Numbered steps
    + lane labels.'
  color_independent_encoding: Shape + label; color never sole cue.
  dependencies:
  - CLAIM_PLAN.yaml
  edition_scope: concept_edition
  title_intent: "Instruction \u2192 schedule \u2192 execute \u2192 result path (accessible)"
- provisional_id: FIG-CE3-004
  figure_type: causal_diagram
  pedagogical_purpose: Help Operators separate CPU, memory, storage, scheduler contention,
    and thermal hypotheses.
  reader_should_notice: '[''Same human lag can have different hidden causes'', ''Observation
    vs inference boundary'']'
  data_or_evidence_source: illustrative
  truth_classification: conceptual
  expected_geometry: "Tree or branched flowchart from symptom \u2192 candidate domains\
    \ \u2192 next inspection."
  accessibility_description_requirement: 'alt_text_required: True; long_description_required:
    True; reading_order_required: True; color_independent_encoding: Branch labels;
    icons with text, not color alone.'
  color_independent_encoding: Shape + label; color never sole cue.
  dependencies:
  - LAB_PLAN.md
  - STABILITY_CONTRACT.md
  edition_scope: concept_edition
  title_intent: Bottleneck symptom branches
- provisional_id: FIG-CE3-005
  figure_type: component_cards
  pedagogical_purpose: Prevent 'GPU only for games' and 'OS is the GPU' misconceptions.
  reader_should_notice: '[''Who orchestrates vs who executes specialized work'', ''Shared
    resource limits (memory bandwidth, power)'']'
  data_or_evidence_source: patterson-hennessy-riscv; khronos-vulkan-overview (pointer)
  truth_classification: conceptual
  expected_geometry: Two side-by-side cards with definition / analogy / function /
    failure symptoms.
  accessibility_description_requirement: 'alt_text_required: True; long_description_required:
    True; reading_order_required: True; color_independent_encoding: Card titles +
    bullet structure.'
  color_independent_encoding: Shape + label; color never sole cue.
  dependencies:
  - CONCEPT_GRAPH.yaml
  edition_scope: concept_edition
  title_intent: CPU vs accelerator/GPU role cards
- provisional_id: FIG-CE3-006
  figure_type: before_after_compare
  pedagogical_purpose: 'Experience B: on-screen text vs persisted file.'
  reader_should_notice: '[''Quit+reopen outcome differs if durability incomplete'']'
  data_or_evidence_source: illustrative_lab
  truth_classification: conceptual
  expected_geometry: 'Two panels: RAM working set vs storage file object.'
  accessibility_description_requirement: 'alt_text_required: True; long_description_required:
    True; reading_order_required: False; color_independent_encoding: Panel titles
    + status words (volatile/durable).'
  color_independent_encoding: Shape + label; color never sole cue.
  dependencies:
  - EXPERIENCE_MAP.md
  edition_scope: concept_edition
  title_intent: Save buffer vs durable file
- provisional_id: FIG-CE3-007
  figure_type: budget_diagram
  pedagogical_purpose: "Show performance available under a thermal/power ceiling without\
    \ fake \xB0C or watt numbers."
  reader_should_notice: '[''Sustained work can reduce available performance'', "Not
    necessarily a software ''bug''"]'
  data_or_evidence_source: linux-cpu-freq (concept); hardware POWER_TREE as optional
    representative architecture
  truth_classification: conceptual
  expected_geometry: Ceiling line over a qualitative performance-vs-time sketch; label
    ILLUSTRATIVE.
  accessibility_description_requirement: 'alt_text_required: True; long_description_required:
    True; reading_order_required: True; color_independent_encoding: Line style + text
    annotation; avoid red=bad only.'
  color_independent_encoding: Shape + label; color never sole cue.
  dependencies:
  - CLAIM_PLAN.yaml
  edition_scope: concept_edition
  title_intent: Qualitative power/thermal ceiling
- provisional_id: FIG-CE3-008
  figure_type: representative_architecture
  pedagogical_purpose: If used, show form-factor differences as learning benchmarks
    only.
  reader_should_notice: '[''PHYSICAL_PENDING / not shipping products'', ''Different
    form factors stress different bottlenecks'']'
  data_or_evidence_source: SRC-HARDWARE device-quartet docs + comparison matrix (targets,
    not measurements)
  truth_classification: project_specific
  expected_geometry: Four labeled silhouettes with role tags; watermark Representative
    educational architecture.
  accessibility_description_requirement: 'alt_text_required: True; long_description_required:
    True; reading_order_required: True; color_independent_encoding: Names + role tags.'
  color_independent_encoding: Shape + label; color never sole cue.
  dependencies:
  - SOURCE_REGISTER.md
  edition_scope: concept_edition_optional
  qualification: conceptual
  title_intent: Device Quartet compute/storage roles (optional callout)
- provisional_id: FIG-CE3-009
  figure_type: lab_fixture
  pedagogical_purpose: Teach what to read in Task Manager / Activity Monitor / top
    without requiring proprietary tools.
  reader_should_notice: '[''CPU vs Memory vs Disk columns'', ''Observation fields
    vs interpretation fields'']'
  data_or_evidence_source: LAB-CMS-001 fixture screenshots (to be captured; no fake
    numbers in finals)
  truth_classification: measured
  expected_geometry: Screenshot + callout overlay with reading order.
  accessibility_description_requirement: 'alt_text_required: True; long_description_required:
    True; reading_order_required: True; color_independent_encoding: Numbered callouts;
    provide CSV/text equivalent of readings.'
  color_independent_encoding: Shape + label; color never sole cue.
  dependencies:
  - LAB_PLAN.md
  edition_scope: concept_edition
  qualification: later_fixture
  title_intent: Annotated commodity monitor snapshot
maps_to:
- CH06
- CH07
- CH12
non_goals:
- Decorative gradients or abstract 'tech meshes' as evidence.
- Fake flame graphs with invented stack samples presented as reader-device truth.
- Unlabeled Device Quartet marketing renders.
