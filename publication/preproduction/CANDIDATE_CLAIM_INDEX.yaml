schema_version: 1.0.0
status: CANDIDATE_PREPRODUCTION
gate_note: "GATE_3_IN_PROGRESS \u2014 READER_EVIDENCE_PENDING"
rights: Candidate only. Does not modify live CH02 / Gate 3 evidence registries.
claims:
- source_package: ce-01
  provisional_id: CLM-CE1-001
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: A graphical user interface is only the visible surface of a larger cooperating
    technology system.
- source_package: ce-01
  provisional_id: CLM-CE1-002
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: Everyday interactive software commonly follows an event-driven path in which
    inputs are processed, application state is updated, and outputs are presented
    to the person.
- source_package: ce-01
  provisional_id: CLM-CE1-003
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: Not every useful device experience requires a remote network service; some
    paths remain local-only.
- source_package: ce-01
  provisional_id: CLM-CE1-004
  status: ILLUSTRATIVE_ONLY
  claim_class: general_technical
  text: A connectivity indicator (for example, Wi-Fi/cellular bars) is not sufficient
    evidence that a specific application service is healthy.
- source_package: ce-01
  provisional_id: CLM-CE1-005
  status: PHYSICAL_PENDING
  claim_class: project_specific
  text: Device Quartet entries (Student 14.5-inch, Handheld Hybrid, DS-XL Coder, Edge
    IO Wearables) are research form factors / educational learning benchmarks; physical
    fabrication remains pending.
- source_package: ce-01
  provisional_id: CLM-CE1-006
  status: SOURCE_IDENTIFIED
  claim_class: project_specific
  text: WAIKE accepted main hosts file-backed digital_rc course packages that can
    support adjacent systems-thinking competencies (for example GENERAL_IT observation/inference
    and ticket triage), but no course module is literally titled Technology Is a System,
    Not a Screen.
- source_package: ce-01
  provisional_id: CLM-CE1-007
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: "ISO/IEC 25010 provides a product-quality model whose characteristics (including\
    \ interaction capability / related usability concepts and reliability) can frame\
    \ why human-visible quality depends on multiple system properties\u2014not only\
    \ pixels."
- source_package: ce-01
  provisional_id: CLM-CE1-008
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: Working memory (RAM) and durable storage are different roles in computer systems
    and are not interchangeable explanations for every 'slow open' symptom.
- source_package: ce-01
  provisional_id: CLM-CE1-009
  status: ILLUSTRATIVE_ONLY
  claim_class: illustrative
  text: Illustrative CE-1 ecosystem diagrams are conceptual educational architecture,
    not measured device teardowns or validated EVT hardware.
- source_package: ce-01
  provisional_id: CLM-CE1-010
  status: PROJECT_EVIDENCE_NEEDED
  claim_class: measured_later
  text: Wall-clock 'chrome visible' versus 'content usable' timings collected in LAB-SYS-001
    are learner observations on commodity devices, not publication benchmarks or touch-to-photon
    laboratory measurements.
- source_package: ce-03
  provisional_id: CLM-CE3-001
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: A CPU executes program instructions; application logic runs on processors
    under OS mediation rather than being wholly performed by the OS itself.
- source_package: ce-03
  provisional_id: CLM-CE3-002
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: Registers, caches, main memory (RAM), and secondary storage form a memory
    hierarchy with different capacity, latency, and volatility/durability properties.
- source_package: ce-03
  provisional_id: CLM-CE3-003
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: "RAM is volatile working memory under normal power-off conditions; storage\
    \ is the ordinary durable home for files\u2014 these layers are not interchangeable."
- source_package: ce-03
  provisional_id: CLM-CE3-004
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: Processes and threads are OS abstractions for concurrent execution; the scheduler
    allocates processor time among runnable entities.
- source_package: ce-03
  provisional_id: CLM-CE3-005
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: Adding CPU cores can improve throughput for parallelizable work but does not
    guarantee lower latency for every user interaction.
- source_package: ce-03
  provisional_id: CLM-CE3-006
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: GPUs and other accelerators execute specialized parallel workloads; host software
    and OS/device interfaces still orchestrate submission and resource sharing.
- source_package: ce-03
  provisional_id: CLM-CE3-007
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: Files are OS-managed durable objects; completing a durable save can require
    storage I/O beyond keeping data in RAM.
- source_package: ce-03
  provisional_id: CLM-CE3-008
  status: ILLUSTRATIVE_ONLY
  claim_class: illustrative
  text: "Human-visible local lag can arise from CPU contention, memory pressure, storage\
    \ I/O wait, scheduling competition, or power/thermal limits\u2014even when a connectivity\
    \ icon appears healthy."
- source_package: ce-03
  provisional_id: CLM-CE3-009
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: Power and thermal management can reduce available performance to protect the
    device and stay within budgets.
- source_package: ce-03
  provisional_id: CLM-CE3-010
  status: PROJECT_EVIDENCE_NEEDED
  claim_class: project_specific
  text: gunnchOS Device Quartet documents define research form factors / learning
    benchmarks that are concept-complete with physical validation still pending.
- source_package: ce-03
  provisional_id: CLM-CE3-011
  status: PROJECT_EVIDENCE_NEEDED
  claim_class: project_specific
  text: gunnchOS device OS accepted main provides an alpha digital experience layer
    with claim boundaries; it is not a shipping kernel/init OS and must not be cited
    as proof of production process scheduling on hardware.
- source_package: ce-03
  provisional_id: CLM-CE3-012
  status: SOURCE_IDENTIFIED
  claim_class: project_specific
  text: WAIKE accepted main hosts file-backed courses with adjacent labs (e.g., MCU
    memory map, storage triage, power budget) but no exact CE-3 'local lag diagnosis'
    course module ID.
- source_package: ce-03
  provisional_id: CLM-CE3-013
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: DDR4 SDRAM devices are specified by JEDEC JESD79-4 family documents (revision
    D published July 2021 at audit time).
- source_package: ce-03
  provisional_id: CLM-CE3-014
  status: SOURCE_NEEDED
  claim_class: standards_based
  text: NVMe is an industry interface for accessing non-volatile memory over PCI Express
    used by many modern SSDs; exact revision claims require citing a specific NVMe
    Base Specification version.
- source_package: ce-04
  provisional_id: CLM-CE4-001
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: IPv4 defines a datagram (packet) model with header fields including source/destination
    addresses, protocol, and TTL.
- source_package: ce-04
  provisional_id: CLM-CE4-002
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: IPv6 is specified as the Internet Protocol version 6 standard (RFC 8200).
- source_package: ce-04
  provisional_id: CLM-CE4-003
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: TCP provides a connection-oriented byte-stream transport service with sequenced
    data and acknowledgment-based recovery mechanisms as specified in RFC 9293.
- source_package: ce-04
  provisional_id: CLM-CE4-004
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: UDP provides a minimal message-oriented transport without TCP-style connection
    reliability machinery (RFC 768).
- source_package: ce-04
  provisional_id: CLM-CE4-005
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: DNS defines concepts for domain names and resolution (RFC 1034/1035).
- source_package: ce-04
  provisional_id: CLM-CE4-006
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: RFC 1918 reserves IPv4 address blocks for private internets, commonly used
    behind gateways/NAT on LANs.
- source_package: ce-04
  provisional_id: CLM-CE4-007
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: IEEE 802.11 is the standards family underlying Wi-Fi wireless LAN technologies.
- source_package: ce-04
  provisional_id: CLM-CE4-008
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: 3GPP specifies a 5G System architecture (TS 23.501) distinct from IEEE 802.11
    Wi-Fi LAN access.
- source_package: ce-04
  provisional_id: CLM-CE4-009
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: NIST SP 800-145 defines cloud computing via on-demand network access to a
    shared pool of configurable computing resources, with listed essential characteristics
    and service/deployment models.
- source_package: ce-04
  provisional_id: CLM-CE4-010
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: NIST SP 500-325 describes a fog computing conceptual model related to distributing
    compute/storage/networking closer to users/things (edge-adjacent framing).
- source_package: ce-04
  provisional_id: CLM-CE4-011
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: Browser developer tools can expose network request timing phases useful for
    classroom observation of connectivity-dependent pages.
- source_package: ce-04
  provisional_id: CLM-CE4-012
  status: PROJECT_EVIDENCE_NEEDED
  claim_class: project_specific
  text: WAIKE accepted main hosts a COMPUTER_NETWORKING digital_rc course including
    offline-gradable labs such as lab_datapath for crafted Ethernet/IPv4 forwarding
    reasoning.
- source_package: ce-04
  provisional_id: CLM-CE4-013
  status: ILLUSTRATIVE_ONLY
  claim_class: illustrative
  text: A connectivity icon can remain positive while an application-level sync experience
    fails.
- source_package: ce-04
  provisional_id: CLM-CE4-014
  status: PHYSICAL_PENDING
  claim_class: measured_later
  text: Specific millisecond latency budgets for CE-4 anchor experiences on reader
    devices.
- source_package: ce-04
  provisional_id: CLM-CE4-015
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: QUIC is an IETF transport protocol specified in RFC 9000, often used with
    HTTP/3 stacks.
- source_package: ce-05
  provisional_id: CLM-CE5-001
  status: SOURCE_IDENTIFIED
  claim_class: project_specific
  text: WAIKE accepted main hosts digital_rc course packages AI_ML_EDGE, CYBERSECURITY,
    and COMM_PD_ETHICS with file-backed labs relevant to AI evaluation, identity/RBAC,
    and consent/AI disclosure.
- source_package: ce-05
  provisional_id: CLM-CE5-002
  status: SOURCE_IDENTIFIED
  claim_class: project_specific
  text: gunnchOS device OS accepted main models opt-in telemetry consent with default-off
    posture in documented claim boundaries; it is not a shipping OS and beta_ready
    is false.
- source_package: ce-05
  provisional_id: CLM-CE5-003
  status: PHYSICAL_PENDING
  claim_class: project_specific
  text: Device Quartet form factors remain research/learning benchmarks with physical
    fabrication pending; not commercial AI/security appliances.
- source_package: ce-05
  provisional_id: CLM-CE5-004
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: At a systems level, many modern AI features can be taught as data conditioning
    a model whose parameters are applied at inference time to produce outputs.
- source_package: ce-05
  provisional_id: CLM-CE5-005
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: NIST AI RMF 1.0 provides voluntary organizational guidance for managing AI
    risks and discussing trustworthy/responsible AI system characteristics without
    treating trust as a binary property of 'AI' itself.
- source_package: ce-05
  provisional_id: CLM-CE5-006
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: Digital identity guidance distinguishes assurance concepts around identity
    proofing and authentication; authorization remains a separate access-decision
    concern in systems teaching.
- source_package: ce-05
  provisional_id: CLM-CE5-007
  status: SOURCE_IDENTIFIED
  claim_class: peer_reviewed
  text: Classical protection design principles (e.g., least privilege, fail-safe defaults,
    psychological acceptability) remain useful for connecting security controls to
    usable experience.
- source_package: ce-05
  provisional_id: CLM-CE5-008
  status: ILLUSTRATIVE_ONLY
  claim_class: publication_internal
  text: Illustrative local-vs-cloud latency/privacy comparison tables in CE-5 figures/labs
    are teaching aids unless a measurement bundle is attached.
- source_package: ce-05
  provisional_id: CLM-CE5-009
  status: PROJECT_EVIDENCE_NEEDED
  claim_class: publication_internal
  text: Proposed book lab LAB-TRUST-001 is a publication-side learning design; it
    is not an existing WAIKE course module ID.
- source_package: ce-06
  provisional_id: CLM-CE06-001
  status: SOURCE_IDENTIFIED
  claim_class: illustrative
  text: "The Stability Contract teaching definition \u2014 a user experience exists\
    \ only while multiple hidden technical conditions remain within acceptable bounds\
    \ \u2014 is a publication signature concept (not an ITU term)."
- source_package: ce-06
  provisional_id: CLM-CE06-002
  status: ILLUSTRATIVE_ONLY
  claim_class: general_technical
  text: A system can remain technically connected while the human experience has already
    failed.
- source_package: ce-06
  provisional_id: CLM-CE06-003
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: ITU-T P.10/G.100 provides vocabulary associating Quality of Experience (QoE)
    with the degree of delight or annoyance of the user of an application or service
    (see in-force Recommendation text / widely cited 2017 consolidation).
- source_package: ce-06
  provisional_id: CLM-CE06-004
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: 'QoE and QoS are related but not identical: QoS concerns service characteristics
    bearing on ability to satisfy user needs; QoE concerns user delight/annoyance
    (per ITU-T vocabulary).'
- source_package: ce-06
  provisional_id: CLM-CE06-005
  status: SOURCE_IDENTIFIED
  claim_class: standards_based
  text: ITU-T G.1011 (in force 07/2016) is a reference guide to QoE assessment methodologies
    and distinguishes subjective assessment from objective estimation models.
- source_package: ce-06
  provisional_id: CLM-CE06-006
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: Browser-exposed Performance API interfaces can provide learner-visible timing
    instrumentation for some web experiences.
- source_package: ce-06
  provisional_id: CLM-CE06-007
  status: SOURCE_IDENTIFIED
  claim_class: general_technical
  text: OpenTelemetry conceptual documentation describes telemetry signals including
