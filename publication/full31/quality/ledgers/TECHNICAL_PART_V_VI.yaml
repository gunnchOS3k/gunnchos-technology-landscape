issues:
  - issue_id: TECH-P56-001
    chapter: CH26
    part: VI
    category: TECHNICAL
    severity: MAJOR
    location: "book/chapters/ch26/chapter.md §1 / §5 Version control card"
    finding: >
      Part VI requires an explicit version-control ≠ backup distinction. CH26 defines VCS
      as recording changes so history can be inspected and recovered, and the essay-draft
      analogy reinforces “recoverable copies,” but never states that Git/history is not a
      substitute for backup, disaster recovery, or off-box copies.
    evidence: >
      §1: “recording changes so history can be inspected and recovered”; §5 analogy “dated
      drafts… recovered.” No “VCS ≠ backup” sentence; recovery language can be misread as
      backup literacy.
    proposed_fix: >
      Add one short VCS ≠ backup clause in the opening/definition and on the version-control
      card: history enables inspectable change and careful recovery of *tracked* states; it
      is not a backup policy (untracked files, machine loss, and off-site copies remain
      separate). Cite existing @git-scm-docs only.
    fix_status: FIXED
    meaning_change: false
    citation_required: false
    reviewer_type_needed: TECHNICAL

