- chapter_id: CH06
  number: 6
  title: CPU, Instructions, and Parallel Work
  part: II
  anchor_moment: "You open a local app you already know\u2014notes, a photo editor,\
    \ an IDE, a spreadsheet\u2014while other work is already running. The connectivity\
    \ icon still looks fine. The window still draws. Scroll still tries. Yet the interface\
    \ stutters, a save hangs a beat too long, fans spin up, or the chassis warms under\
    \ your wrists."
  central_question: "When my device feels slow while the network icon looks fine,\
