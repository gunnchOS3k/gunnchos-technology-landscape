findings:
  - id: FIG-CHAPTER-FIELD-TRUNCATION
    severity: major
    area: figures/figure_registry.yaml
    count: 55
    summary: >
      Many figure entries store truncated chapter fields (e.g. CH1- for CH11,
      CH0- for CH20/CH30). Figure index derives chapter from figure_id.
    owner_hint: visuals / figure-registry maintainer
    agent_i_action: documented + ID-derived index; registry not rewritten here to avoid clash
  - id: LAB-INDEX-INCOMPLETE
    severity: minor
    area: book/appendices/lab-index.qmd
    summary: Prior appendix listed 6 labs; registry has 14. Expanded.
    agent_i_action: fixed
  - id: SUBJECT-INDEX-NOT-CLAIMED
    severity: info
    summary: >
      Traditional subject index remains human/editorial. Explicitly stated that
      keyword dumps are not publication-grade subject indexes.
    agent_i_action: policy recorded in parts-chapters appendix + this audit
  - id: CHAPTER-REGISTRY-STATUS-DRIFT
    severity: info
    area: book/chapter_registry.yaml
    summary: >
      Most chapters still show registry status outline while working drafts exist.
      Parts/chapters index warns these are structural markers, not Gate outcomes.
    agent_i_action: labeled honestly in parts-chapters appendix

