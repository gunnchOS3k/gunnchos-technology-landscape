definitions:
  FULL_LAB: >
    Publication-owned package under labs/LAB-*/ with lab.yaml, README, fixture/fallback,
    and portfolio path. May still have packet-quality gaps (missing stub files, DRAFT status).
  INLINE_ACTIVITY: >
    Try It / Build It worksheet that lives in the chapter (and/or inherits a FULL_LAB)
    without a separate labs/LAB-* directory for a proposed ID.
  PROPOSED_LAB: >
    Namespaced opportunity ID in LAB_OPPORTUNITIES or chapter prose that is NOT shipped
    under labs/. Must not be treated as implemented.

quality_rubric_full_lab:
  fields:
    - goal_question
    - level_reader_paths
    - prerequisites
    - safe_setup
    - route
    - fixture_fallback
    - observation_vs_inference
    - evidence_artifact
    - portfolio
    - cleanup_rollback
    - a11y
    - privacy_safety
    - tests_or_validator_coverage
  try_build_must_answer:
    - what_to_observe_or_build
    - evidence_retained
    - mistaken_inference_guard
    - fallback_route
    - explorer_vs_builder_engineer_usefulness
  avoid: "search the web unless research literacy is the explicit goal"

