platforms:
  - id: amazon_kdp_kindle
    display_name: "Amazon KDP — Kindle eBook"
    channel_class: ebook_retailer
    free_list_price_supported: false
    free_list_price_notes: >
      Permanent $0 list price is not available on standard KDP eBook pricing.
      Temporary Free Book Promotion (up to 5 days) requires KDP Select enrollment,
      which conflicts with wide digital distribution. Prefer minimum list price under
      35% royalty and/or Amazon price-match pathway when free elsewhere.
      See FREE_ACCESS_POLICY.md.
    kdp_select_compatible_with_wide_access: false
    manuscript_formats:
      recommended: ["EPUB", "DOC/DOCX", "KPF (Kindle Create)"]
      accepted_also: ["HTML ZIP/HTM/HTML", "RTF", "TXT", "PDF (language-limited)"]
      notes: >
        MOBI for fixed-layout eBooks no longer accepted effective March 2025
        (per KDP help on supported formats). Prefer EPUB validated with Kindle Previewer.
    cover_requirements:
      format: ["TIFF", "JPEG"]
      ideal_px: "2560h x 1600w"
      recommended_min_height_px: 2500
      absolute_min_px: "1000h x 625w"
      max_px: "10000 x 10000"
      colorspace: RGB
      min_resolution_ppi: 300
      ratio_note: "Ideal height/width ratio at least 1.6:1"
    pricing:
      royalty_35_percent_min_usd:
        lt_3mb: 0.99
        ge_3mb_lt_10mb: 1.99
        ge_10mb: 2.99
      royalty_70_percent_band_usd:
        min: 2.99
        max: 12.99
        effective_note: "70% band max expanded to $12.99 effective 2026-07-07 (Amazon.com)"
      max_list_usd: 200.00
    isbn:
      required: false
      free_kdp_isbn: true
      free_isbn_imprint_note: "KDP-assigned ISBN is Amazon-channel associated; not portable for wide imprint branding"
      own_isbn_recommended_for_wide: true
    exclusivity:
      kdp_select: >
        Enrolling in KDP Select commits the digital format exclusively through KDP
        for the exclusivity period; digital distribution elsewhere (including own site)
        is not allowed while enrolled. Physical formats may continue.
    sources:
      - id: kdp_ebook_formats
        source_authority: Amazon KDP Help
        source_url: "https://kdp.amazon.com/help/topic/G200634390"
        source_version_or_effective_date: "retrieved 2026-09-03; page live help (MOBI fixed-layout change effective March 2025 noted on page)"
        retrieved_on: "2026-09-03"
        facts_used: ["DOC/DOCX", "KPF", "EPUB", "MOBI fixed-layout sunset March 2025", "PDF language-limited"]
      - id: kdp_ebook_cover
