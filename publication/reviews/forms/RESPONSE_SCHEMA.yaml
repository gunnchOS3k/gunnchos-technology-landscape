schema_version: 1
schema_id: ADULT_REVIEW_RESPONSE_SCHEMA
field_classification_default: PUBLIC_SAFE
required_fields:
  - review_id
  - candidate_id
  - reviewer_role
  - scope
  - started_at
  - completed_at
  - overall_completion_state
  - findings
finding_required_fields:
  - finding_id
  - location
  - severity
  - category
  - observation
  - why_it_matters
  - suggested_change
  - confidence
  - requires_sme
  - requires_physical_evidence
  - accessibility_issue
  - safety_issue
allowed_severity:
  - BLOCKER
  - MAJOR
  - MODERATE
  - MINOR
  - EDITORIAL
allowed_categories:
  - TECHNICAL
  - CLARITY
  - DEVELOPMENTAL
  - PEDAGOGY
  - ACCESSIBILITY
  - SAFETY
  - PRIVACY
  - CULTURAL
  - VISUAL
  - NAVIGATION
  - LAB_ACTIVITY
  - STANDARDS
  - TERMINOLOGY
  - EVIDENCE
  - PRINT
notes:
  - Do not pre-populate findings.
  - No reviewer is asked to praise the work.
  - PRIVATE_REVIEW_DATA must not be committed with real names/contact info.
